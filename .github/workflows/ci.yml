name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  core:
    name: metamedium-core — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: metamedium-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: metamedium-core/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Committed browser and node bundles must match source
        run: |
          npm run build:browser
          cp dist/metamedium-core.browser.js ../Demos/metamedium-core.browser.js
          git diff --exit-code -- ../Demos/metamedium-core.browser.js
          npm run build:node
          cp dist/metamedium-core.node.mjs ../Demos/metamedium-core.node.mjs
          git diff --exit-code -- ../Demos/metamedium-core.node.mjs
      - name: The MCP hand answers over stdio
        run: node ../Demos/mcp-smoke.mjs
      # The room relay as a Worker (CF1): its protocol, keys and hands over a socket, on a fake Durable
      # Object storage, and what Pages publishes and with which headers. No dependency needed; the
      # workerd test (`npm ci` in cloudflare/relay) runs in the deploy workflow.
      - name: The Cloudflare relay and site
        run: node --test ../cloudflare/relay/relay.worker.test.mjs ../cloudflare/relay/relay.parity.test.mjs ../cloudflare/relay/relay.hands.test.mjs ../cloudflare/site.test.mjs
      - name: Surface fragments must match the built script
        run: node ../Demos/build-surface.mjs --check
      # …and the check itself, on scratch surfaces: it must refuse a name
      # declared at the top of two fragments, which one closure would take
      # without a word.
      - name: The surface's build refuses a function declared twice
        run: node --test ../Demos/build-surface.test.mjs
      # The one surface fragment that names nothing outside itself, so it can be
      # asked questions without a browser (SEAM-1). node --test needs nothing
      # installed, and the test finds the fragment relative to itself, so this
      # job's working directory does not matter.
      - name: The field's reader, on its own
        run: node --test ../Demos/surface/09-field.test.mjs
      # Its sibling (V1-PLAN R6): the hand's rules — what a pen, a finger and a
      # palm do, and the hand tile's face and cycle — pure, in Node.
      - name: The hand's rules, on their own
        run: node --test ../Demos/surface/07-hand.test.mjs
      # The relay's catch-up and the rooms over it (DIRECTOR-PLAN-W2 L1): `replay`
      # is pure; the truncation line and the three-hand room run over a real
      # relay on a free port of 127.0.0.1, with the committed Node bundle checked
      # above. Like the field's test, it finds what it imports relative to itself.
      - name: The relay, on its own
        run: node --test ../Demos/relay.test.mjs
      # The same kind of fragment (V1-PLAN R3): the journal the board this
      # browser keeps is written through, driven by a store held in memory.
      - name: The board's journal, on its own
        run: node --test ../Demos/surface/17-board.test.mjs
      # And its sibling (V1-PLAN R1): the list of boards — names, the trash,
      # which board a page opens and whether the one on screen may be left.
      - name: The boards list, on its own
        run: node --test ../Demos/surface/17-boards.test.mjs
      # The app at /app/ (V1-PLAN R7): its page, its worker and its manifest
      # are made from the old address's, and VERSION is stamped into the page
      # and into both workers' caches — what is committed must be that build.
      - name: The app and its version, in sync
        run: node ../scripts/build-app.mjs --check
      # …and the build and the release script on their own: versions in
      # semver's order, the changelog by unit, a real release cut on a small
      # repository made for it (a commit and an annotated tag, nothing pushed),
      # what it refuses, and a dry run on a scratch clone of this checkout.
      # Git runs there with a configuration of its own and a test identity.
      - name: The app's build and the release script, on their own
        run: node --test ../scripts/build-app.test.mjs ../scripts/release.test.mjs
      # The example boards a first-time hand opens from the boards pane (V1-PLAN R5)
      # are logs the engine makes, never drawn: what is committed under
      # boards/examples must be what scripts/examples.mjs makes today — and the
      # test replays each and asks the engine what it reads.
      - name: The example boards, in sync and read as what they are
        run: node ../scripts/examples.mjs --check && node --test ../scripts/examples.test.mjs

  shard:
    name: shard-3d — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shard-3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shard-3d/package-lock.json
      # The shard imports metamedium-core FROM SOURCE through a vite/vitest
      # alias, and core is zero-dependency TypeScript — so there is nothing to
      # install over there and no bundle to drift.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The hand, and the seat: MCP over stdio, a relay of its own on a free
      # port, and a second hand in Node standing in for the tab. It needs no
      # shard build — it runs the committed Node bundle, as the canvas's does.
      - name: The shard's MCP hand answers over stdio
        run: node mcp-smoke.mjs

  browser:
    name: the browser gate — the canvas and shard scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The runner
        working-directory: e2e
        run: npm ci
      - name: The shard's own dependencies (vite serves it)
        working-directory: shard-3d
        run: npm ci
      - name: Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      # Starts its own servers on free ports, opens a fresh context per
      # scenario, awaits each harness's own result, exits nonzero on a failed
      # assertion, a harness exception, an unexpected page error, or any
      # attempt to reach a real model.
      - name: Run them
        run: node e2e/run.mjs
      - name: What the run saw
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/results
          if-no-files-found: warn

  webkit:
    name: WebKit — the smoke, pencil and tablet, and no lost work, on a second engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The runner
        working-directory: e2e
        run: npm ci
      - name: WebKit
        working-directory: e2e
        run: npx playwright install --with-deps webkit
      # Desktop WebKit, headless — the engine Safari is built on, not an iPad
      # (e2e/README.md). The smoke draws with real pointer input, holds a mark
      # until the field opens and takes one pill; `pencil` (V1-PLAN R6) is the
      # pen and fingers synthesised in the page as iPadOS delivers them — pen
      # draws with pressure, a finger pans, a palm is nothing, the pencil's
      # hover, the field by pen and a pill, a clean, an undo, the keyboard, the
      # hand tile, the mouse untouched, a save and a reload; `keep` is the kill
      # test and the forced failures where WebKit can run them (no crash to
      # send, no quota to force: those skip by name). The canvas only, so the
      # shard needs no install here; the same model guard and exit rules.
      - name: Run them
        run: node e2e/run.mjs --browser webkit smoke pencil keep
      - name: What the run saw
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-webkit-results
          path: e2e/results
          if-no-files-found: warn

  web-app:
    name: Web App Skeleton — typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web App Skeleton
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Web App Skeleton/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
