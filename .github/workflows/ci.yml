name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  web-app:
    name: Web App Skeleton — typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web App Skeleton
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Web App Skeleton/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
