name: Deploy to Cloudflare

# dyna.ink: the site (Cloudflare Pages) and the room relay (a Worker with a Durable Object).
# cloudflare/README.md is what John sets up once; this does the rest.
# GitHub Pages keeps publishing as before — this is a second home, not a move.
#
# When: after CI has passed on a push to master — never on a push alone, so a change that breaks
# the engine, the bundles, the browser gate or WebKit is never deployed — and it deploys the very
# commit CI passed (the run's head_sha, not whatever master is by then). Or by hand, from master
# (Actions → Deploy to Cloudflare → Run workflow). A CI run that failed or was cancelled, a CI run
# for a pull request, and a branch called master in someone's fork deploy nothing.
#
# And only while that commit is still master's tip. CI runs finish in any order — the browser gate
# takes minutes, and a failed run can be re-run days later — and the concurrency group below only
# queues deploys in the order they arrive, so an older commit's CI finishing last would put dyna.ink
# back on it. A commit master has moved past is not deployed (the run says so and stays green): the
# tip's own CI deploys the tip. A deploy by hand takes master as it stands — and is held to the same
# check, because a re-run of one keeps the commit it was first dispatched at: one that master has
# moved past since deploys nothing and fails, saying to run the workflow again.
#
# Secrets: CLOUDFLARE_API_TOKEN (Pages: Edit, Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID.
# With either absent — a fork, a repository not yet set up — every deploy step is skipped and
# the run is green: the first step says whether there is anything to deploy with.
# And, optional, MM_RELAY_SECRET: put on the Worker after each deploy when it is set (from stdin,
# never on a command line or in a log); with none, the Worker keeps the secret it has. The Pages
# project is made the first time, so the whole setup can be done from a browser.
#
# Wrangler is the relay's lockfile's (cloudflare/relay/package-lock.json), for the site and the
# Worker alike: one version, pinned, and no action that installs another.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  site:
    name: dyna.ink — the site (Pages)
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The commit CI passed (workflow_run), or master as it stands (by hand).
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Is there a Cloudflare account to deploy to, and is this commit still master's tip?
        id: have
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "yes=false" >> "$GITHUB_OUTPUT"; echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set — nothing to deploy, which is fine."; exit 0; fi
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha) || { echo "Could not read which commit master is at now, so nothing was deployed."; exit 1; }
          if [ "$EVENT" = "workflow_run" ]; then
            if [ "$tip" != "$DEPLOY_SHA" ]; then echo "yes=false" >> "$GITHUB_OUTPUT"; echo "master has moved on to $tip since CI passed $DEPLOY_SHA — nothing deployed: $tip is deployed by its own CI, so dyna.ink never goes back to an older commit."; exit 0; fi
          elif [ "$tip" != "$DEPLOY_SHA" ]; then
            echo "yes=false" >> "$GITHUB_OUTPUT"; echo "This run was dispatched at $DEPLOY_SHA and master is at $tip now — nothing deployed, so dyna.ink never goes back to an older commit. Run the workflow again: a re-run keeps the commit it was first dispatched at."; exit 1
          fi
          echo "yes=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.have.outputs.yes == 'true'
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v4
        if: steps.have.outputs.yes == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/relay/package-lock.json
      - name: The site's own checks
        if: steps.have.outputs.yes == 'true'
        run: node --test cloudflare/site.test.mjs
      - name: Build the site, naming the commit in the app's pages
        if: steps.have.outputs.yes == 'true'
        run: node cloudflare/build-site.mjs --commit "$DEPLOY_SHA"
      - name: Wrangler, from the relay's lockfile
        if: steps.have.outputs.yes == 'true'
        working-directory: cloudflare/relay
        run: npm ci
      - name: The Pages project, made the first time
        if: steps.have.outputs.yes == 'true'
        run: |
          W=cloudflare/relay/node_modules/.bin/wrangler
          if "$W" pages project list | grep -qw dyna-ink; then echo "the Pages project dyna-ink is there"; else "$W" pages project create dyna-ink --production-branch=master; fi
      - name: Deploy to Pages
        if: steps.have.outputs.yes == 'true'
        run: |
          W=cloudflare/relay/node_modules/.bin/wrangler
          "$W" pages deploy cloudflare/dist --project-name=dyna-ink --branch=master --commit-hash="$DEPLOY_SHA" --commit-dirty=true

  relay:
    name: dyna.ink — the room relay (Worker)
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Is there a Cloudflare account to deploy to, and is this commit still master's tip?
        id: have
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "yes=false" >> "$GITHUB_OUTPUT"; echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set — nothing to deploy, which is fine."; exit 0; fi
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha) || { echo "Could not read which commit master is at now, so nothing was deployed."; exit 1; }
          if [ "$EVENT" = "workflow_run" ]; then
            if [ "$tip" != "$DEPLOY_SHA" ]; then echo "yes=false" >> "$GITHUB_OUTPUT"; echo "master has moved on to $tip since CI passed $DEPLOY_SHA — nothing deployed: $tip is deployed by its own CI, so dyna.ink never goes back to an older commit."; exit 0; fi
          elif [ "$tip" != "$DEPLOY_SHA" ]; then
            echo "yes=false" >> "$GITHUB_OUTPUT"; echo "This run was dispatched at $DEPLOY_SHA and master is at $tip now — nothing deployed, so dyna.ink never goes back to an older commit. Run the workflow again: a re-run keeps the commit it was first dispatched at."; exit 1
          fi
          echo "yes=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.have.outputs.yes == 'true'
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v4
        if: steps.have.outputs.yes == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/relay/package-lock.json
      - name: The relay's tests, in Node and in workerd
        if: steps.have.outputs.yes == 'true'
        working-directory: cloudflare/relay
        run: |
          npm ci
          npm test
      - name: Deploy the Worker
        if: steps.have.outputs.yes == 'true'
        working-directory: cloudflare/relay
        run: npx wrangler deploy
      - name: The relay's secret, from MM_RELAY_SECRET when it is set
        if: steps.have.outputs.yes == 'true'
        working-directory: cloudflare/relay
        env:
          MM_RELAY_SECRET: ${{ secrets.MM_RELAY_SECRET }}
        run: |
          if [ -z "$MM_RELAY_SECRET" ]; then echo "MM_RELAY_SECRET is not set here — the Worker keeps the secret it has (with none it refuses every room)."; exit 0; fi
          printf '%s' "$MM_RELAY_SECRET" | npx wrangler secret put MM_RELAY_SECRET
