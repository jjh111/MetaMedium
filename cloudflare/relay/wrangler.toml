# The room relay: a Worker in front of one Durable Object per room (README.md, ../README.md).
#   wrangler deploy                      # from this folder; the deploy workflow does it on a push to master
#   wrangler secret put MM_RELAY_SECRET  # once: the secret room keys are made from (room-key.mjs)
name = "dyna-relay"
main = "src/worker.mjs"
compatibility_date = "2025-09-01"
# `request.signal` aborts when a hand's stream is dropped, so its writer is let go at once.
compatibility_flags = ["enable_request_signal"]
workers_dev = true

# relay.dyna.ink, once dyna.ink is a zone in this Cloudflare account (or add the custom domain
# to the Worker in the dashboard, which does the same):
# routes = [{ pattern = "relay.dyna.ink", custom_domain = true }]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Counts for the routes beside the rooms (opening a room, asking a model): one object per scope
# (src/limits.mjs), so a limit is one count wherever a request lands.
[[durable_objects.bindings]]
name = "LIMITS"
class_name = "Limits"

# SQLite-backed, which the free plan requires, and what a room's lines are kept in.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Limits"]

# Workers AI, for the model routes (src/ai.mjs): the Worker asks the model, so no key is ever
# in a browser. Billed to the account that deploys this Worker.
[ai]
binding = "AI"

[vars]
# More origins a browser may call from, comma-separated (dyna.ink, its www, the github.io
# address and localhost are built in):
# MM_RELAY_ORIGINS = "https://preview.dyna.ink"
# MM_RELAY_MAX_LINES = "5000"
# MM_RELAY_MAX_BYTES = "32000000"
# MM_RELAY_ASSET_BYTES = "67108864"   # bytes of pictures a room keeps (A1); past it a put is refused
# The model routes (src/ai.mjs, Demos/decide-protocol.mjs): who may ask — off | keyed (a room's key only) |
# limited (the app's own pages, per address, and keyed hands; the default) — and how many calls a day across
# everyone, past which a decision is refused with 429 and the engine's ranking stands:
# MM_DECIDE = "limited"
# MM_AI_DAILY = "20000"
# dyna.ink's own writer and reader (/ai/v1/chat/completions, Demos/ai-protocol.mjs): the Workers AI model each short
# name asks (the page never names one), who may ask — off | keyed | limited, following MM_DECIDE when unset — and how
# many calls a day across everyone (a budget of its own: a chat call costs far more than a decision). Some newer models
# may need the Workers Paid plan.
# MM_AI_WRITER = "@cf/qwen/qwen3.8-27b"
# MM_AI_READER = "@cf/qwen/qwen3.8-27b"
# MM_AI_CHAT = "limited"
# MM_AI_CHAT_DAILY = "2000"
# Rooms anyone opens from the app (POST /rooms, src/mint.mjs):
# MM_RELAY_MINT = "0"                  # open no new rooms (503, in words)
# MM_RELAY_MINT_PER_HOUR = "10"        # rooms one address may open an hour
# MM_RELAY_MINT_PER_DAY = "500"        # rooms the relay opens a day, in all
# MM_RELAY_ROOM_IDLE_DAYS = "30"       # a room it opened is forgotten this long after it was last used
# What the relay keeps, counted across rooms (src/store.mjs) — an operating ceiling under what the plan allows:
# MM_RELAY_STORE_PER_DAY = "268435456" # characters and bytes one address may keep a day in every room (a line counts 4 KiB more, for its rows)
# MM_RELAY_MINTED_HELD = "2147483648"  # bytes every room it opened may hold at once; past it they keep nothing more and none is opened
# MM_RELAY_MINTED_PER_DAY = "2147483648" # characters and bytes every room it opened may keep a day, in all (a line 4 KiB more)
