# The room relay: a Worker in front of one Durable Object per room (README.md, ../README.md).
#   wrangler deploy                      # from this folder; the deploy workflow does it on a push to master
#   wrangler secret put MM_RELAY_SECRET  # once: the secret room keys are made from (room-key.mjs)
name = "dyna-relay"
main = "src/worker.mjs"
compatibility_date = "2025-09-01"
# `request.signal` aborts when a hand's stream is dropped, so its writer is let go at once.
compatibility_flags = ["enable_request_signal"]
workers_dev = true

# relay.dyna.ink, once dyna.ink is a zone in this Cloudflare account (or add the custom domain
# to the Worker in the dashboard, which does the same):
# routes = [{ pattern = "relay.dyna.ink", custom_domain = true }]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Counts for the routes beside the rooms (opening a room, asking a model): one object per scope
# (src/limits.mjs), so a limit is one count wherever a request lands.
[[durable_objects.bindings]]
name = "LIMITS"
class_name = "Limits"

# SQLite-backed, which the free plan requires, and what a room's lines are kept in.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Limits"]

# Workers AI, for the model routes (src/ai.mjs): the Worker asks the model, so no key is ever
# in a browser. Billed to the account that deploys this Worker.
[ai]
binding = "AI"

[vars]
# More origins a browser may call from, comma-separated (dyna.ink, its www, the github.io
# address and localhost are built in):
# MM_RELAY_ORIGINS = "https://preview.dyna.ink"
# MM_RELAY_MAX_LINES = "5000"
# MM_RELAY_MAX_BYTES = "32000000"
# MM_RELAY_ASSET_BYTES = "67108864"   # bytes of pictures a room keeps (A1); past it a put is refused
