<!DOCTYPE html>
<!-- The app, at /app/ (V1-PLAN R7). Made from Demos/session-engine.html by scripts/build-app.mjs — edit that page, run the build. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MetaMedium — Ink Over Living Artifacts</title>
<link rel="stylesheet" href="../Demos/surface/surface.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="metamedium-version" content="0.0.0">
<!-- Installed on an iPad (PLAN-IPAD-NOTES I3): iOS takes the Home Screen icon from the page, as a PNG, and
     the rest of what makes it an app from these. The theme colour is the surface's own ground in each theme
     (surface.css --ground); icons/ is made by scripts/make-icons.mjs. -->
<link rel="apple-touch-icon" sizes="180x180" href="../Demos/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MetaMedium">
<meta name="theme-color" content="#f8f6f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)">
</head>
<body>
<div id="stage"></div>
<canvas id="canvas"></canvas>

<header class="bar" id="bar">
  <div class="barLeft">
    <span class="wordmark">MetaMedium</span>
    <button id="panelToggle" aria-expanded="true" title="Show or hide the panel">panel ▾</button>
    <div id="viewBar" hidden></div>
  </div>
  <div class="barRight">
    <div class="markChip" id="markChip" title="Your mark: circle some marks, then draw it across them to see what they can become. The built-in mark is a check ✓ — click to teach your own by drawing it five times.">
      <canvas id="markGlyph" width="34" height="22"></canvas><span id="markName">check</span>
    </div>
    <button id="findBtn" aria-pressed="false" title="Find a word on any board (/ or ⌘K): labels, names, typed text, figures, Mermaid, and what was read from writing">find</button>
    <button id="undoBtn" title="Undo (⌘Z)">undo</button>
    <button id="ccBtn" aria-pressed="false" title="Controls" aria-label="Controls"><i></i><i></i><i></i><i></i></button>
  </div>
</header>

<div id="cc" hidden>
  <!-- Three labelled groups (PLAN-USER-SURFACE U1f): what the board is, how it looks, and who helps. Reset stands with the board, far from help. -->
  <div class="ccGroup" data-group="board"><div class="ccHead">Board</div><div class="ccTiles">
    <button id="boardsBtn" aria-pressed="false"></button>
    <button id="folderBtn"></button>
    <button id="importBtn"></button>
    <button id="exportBtn"></button>
    <button id="resetBtn"></button>
  </div></div>
  <div class="ccGroup" data-group="view"><div class="ccHead">View</div><div class="ccTiles">
    <div class="tile wide" id="zoomTile">
      <span class="k">zoom</span>
      <span class="zoomRow"><button id="zoomOut" title="Zoom out">−</button><span class="z" id="zoomPct">100%</span><button id="zoomIn" title="Zoom in">+</button><button id="fitBtn" title="Fit everything on screen">fit</button></span>
    </div>
    <button id="gridBtn" aria-pressed="false"></button>
    <button id="themeBtn"></button>
    <button id="handBtn"></button>
    <button id="snapMode"></button>
    <button id="snapBtn" hidden></button>
  </div></div>
  <div class="ccGroup" data-group="helpers"><div class="ccHead">Helpers</div><div class="ccTiles">
    <button id="modelBtn" aria-pressed="false"></button>
    <button id="liveBtn"></button>
    <button id="autoReadBtn"></button>
    <button id="packsBtn" aria-pressed="false"></button>
    <button id="teachBtn" aria-pressed="false"></button>
    <button id="helpBtn"></button>
  </div></div>
  <!-- Pictures come in by one of two inputs, never one with both: a single input that asks for the camera too may open the camera alone. photos: the library, several at once; camera: one shot. The third is every other kind of file. -->
  <input id="photosInput" type="file" accept="image/*,.svg" multiple hidden>
  <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
  <input id="importInput" type="file" accept=".svg,.html,.htm,.js,.mjs,.json,.md,.txt,.mmd,.mermaid" multiple hidden>
</div>

<div id="teachPanel" hidden>
  <p class="hint" id="teachHint"></p>
  <canvas id="teachPad"></canvas>
  <div id="teachDots"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="tpRow">
    <button id="teachUse" disabled>Use this mark</button>
    <button id="teachClear">Clear</button>
    <button id="teachForget" hidden>Forget</button>
    <button id="teachClose" hidden>Close</button>
  </div>
  <div id="teachStatus"></div>
</div>

<div id="modelPanel" hidden>
  <div class="mpSection">
    <div class="mpHead"><span>on this machine</span><button id="mpDetect" class="ghost">Detect</button></div>
    <div id="mpLocal" class="mpLocal"></div>
  </div>
  <div class="mpSection">
    <div class="mpHead"><span>by key</span></div>
    <select id="mpProvider">
      <option value="openRouter">OpenRouter</option>
      <option value="anthropic">Anthropic</option>
      <option value="custom">Custom OpenAI-compatible endpoint</option>
      <option value="mcp">MCP server (the door)</option>
    </select>
    <input id="mpEndpoint" placeholder="http://host:port/v1" autocomplete="off" spellcheck="false" hidden />
    <input id="mpModel" placeholder="model id" autocomplete="off" spellcheck="false" />
    <input id="mpKey" type="password" placeholder="API key" autocomplete="off" />
    <label class="mpRemember"><input type="checkbox" id="mpRememberKey" /> remember the key on this device</label>
    <div class="mpRow">
      <button id="mpAdd">Join</button>
      <button id="mpClose" class="ghost" hidden>Close</button>
    </div>
  </div>
  <div id="mpStatus" class="hint"></div>
  <div id="mpList"></div>
  <div class="mpSection mpOwn">
    <div class="mpHead"><span>the canvas, with no model</span></div>
    <div id="mpTools" class="mpTools"></div>
  </div>
</div>

<div id="importPanel" hidden>
  <div class="exRow">
    <button data-import="photos" title="Pictures and SVGs from your library or your files — several at once. They are kept with the board and drawn on it, under your ink">photos</button>
    <button data-import="camera" title="Take a picture of a page or a whiteboard now">camera</button>
    <button data-import="file" title="A page, a script, a text, Mermaid, JSON — a file of a kind the canvas knows becomes a thing on the board">other files</button>
  </div>
</div>
<div id="exportPanel" hidden>
  <div class="exRow">
    <button data-export="svg" title="Every mark as a path, the clean form where one is held">board.svg</button>
    <button data-export="png" title="The canvas as pixels, as it is on screen">board.png</button>
    <button data-export="log" title="The whole board as a log: a header line, then one event per line">canvas.jsonl</button>
  </div>
  <div class="exRow" id="exMermaid" hidden>
    <button data-export="mermaid" title="The board as Mermaid text">flowchart.mmd</button>
  </div>
</div>
<div id="helpPanel" hidden><p class="hint" id="helpVersion"></p><div class="helpBody"></div></div>
<div id="boardsPanel" hidden>
  <div class="bdList"></div>
  <div id="boardsStatus" class="hint" aria-live="polite"></div>
  <input id="boardsFile" type="file" accept=".jsonl,.ndjson,.json,.txt,application/json" hidden>
</div>
<div id="findPanel" hidden>
  <input id="findInput" type="text" placeholder="find a word on any board" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="find a word on any board">
  <div id="findStatus" class="hint" aria-live="polite"></div>
  <div class="fdList"></div>
</div>
<div id="packsPanel" hidden>
  <p class="hint">A board says which packs it uses. Using one is an event in its log — undo takes it back — and what it ships is matched here as if you had taught it.</p>
  <div class="pkList"></div>
  <div id="packsStatus" class="hint" aria-live="polite"></div>
</div>
<div id="livePanel" hidden>
  <input id="liveRoom" placeholder="room" autocomplete="off" spellcheck="false" />
  <input id="liveName" placeholder="your name in the room" autocomplete="off" spellcheck="false" />
  <input id="liveRelay" placeholder="relay URL — empty for other tabs on this machine" autocomplete="off" spellcheck="false" />
  <div class="mpRow"><button id="liveJoin">Join</button><button id="liveClaude" title="the room Claude Code joins through node Demos/mcp.mjs: room “claude”, relay on this machine">with Claude</button></div>
  <div id="liveStatus" class="hint"></div>
</div>

<div id="grid" hidden></div>
<textarea id="textEditor" hidden spellcheck="false" placeholder="type here — Enter keeps it, Shift+Enter for a new line, Esc drops it"></textarea>
<aside id="inspector" aria-live="polite"></aside>
<div id="summon"></div>
<canvas id="minimap" hidden aria-label="the whole board; tap or drag to pan"></canvas>
<div class="scrimBottom"></div>
<div class="status" id="status"></div>
<div id="replay" hidden>
  <button id="rpPrev" title="Previous step (←)">←</button>
  <button id="rpPlay" title="Play / pause (space)">▶</button>
  <button id="rpNext" title="Next step (→)">→</button>
  <input id="rpScrub" type="range" min="0" max="0" value="0" />
  <span class="rpStep" id="rpStep"></span>
  <div class="rpCaption" id="rpCaption"></div>
</div>

<script src="../Demos/metamedium-core.browser.js"></script>
<script src="../Demos/session-engine.js"></script>
</body>
</html>
