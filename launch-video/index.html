<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dyna.ink soft launch</title>
<!-- The soft-launch film, played live: film.js is the composition (a pure function of time), this page plays and
     scrubs it, synth.js makes its sound here on the first play (in a worker). Both are inlined below by
     `node launch-video/build.mjs`, so this one file plays wherever it is opened; ?embed is the whitepaper's
     figure, and `node launch-video/render.mjs` still renders it to MP4.
     Colours are brand/tokens.css's; the kinds' colours are OKLCH, as V1-SPEC §3.3 has it. -->
<style>
  /* Vendored (OFL-1.1), so a frame renders the same with no network: IBM Plex Mono, the brand's one face,
     and Caveat for the hand's own writing on the board — ink, never chrome. */
  @font-face { font-family: 'Caveat'; font-weight: 600; src: url('fonts/Caveat-600.ttf') format('truetype'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; src: url('fonts/IBMPlexMono-400.ttf') format('truetype'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; src: url('fonts/IBMPlexMono-500.ttf') format('truetype'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 600; src: url('fonts/IBMPlexMono-600.ttf') format('truetype'); }
  :root { --paper:#f8f5ef; --ink:#0c1a24; --ink-3:#66737c; --teal:#0b6f7d; --rule:#ded6c8; }
  html, body { margin:0; background:#1b1d1f; height:100%; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; font-family:'IBM Plex Mono', monospace; color:#ddd; }
  #stage { width:min(96vw, calc((100vh - 70px) * 16 / 9)); aspect-ratio:16/9; background:var(--paper); box-shadow:0 8px 40px rgba(0,0,0,.4); }
  #stage svg { width:100%; height:100%; display:block; }
  #stage { cursor:pointer; }
  #bar { display:flex; gap:12px; align-items:center; width:min(96vw, calc((100vh - 70px) * 16 / 9)); font-size:13px; }
  #bar input[type=range] { flex:1; }
  #bar button { font:inherit; background:#333; color:#eee; border:1px solid #555; border-radius:4px; padding:4px 10px; cursor:pointer; }
  body.render { background:var(--paper); display:block; }
  body.render #stage { width:1920px; height:1080px; box-shadow:none; }
  body.render #bar { display:none; }
  /* ?embed: the stage fills its frame (the whitepaper's figure), the bar under it, never over the picture */
  body.embed { background:var(--paper); height:100vh; gap:0; justify-content:flex-start; overflow:hidden; }
  body.embed #stage { width:100%; flex:1; min-height:0; aspect-ratio:auto; box-shadow:none; }
  #stage { position:relative; }
  #big { display:none; }
  body.embed #big { display:grid; place-items:center; position:absolute; inset:0; margin:auto; width:88px; height:88px; border-radius:50%;
    border:1px solid rgba(111,179,184,0.7); background:rgba(19,19,21,0.85); color:#93cbcf; cursor:pointer; padding:0; }
  body.embed #big svg { width:34px; height:34px; margin-left:5px; }
  body.embed.playing #big, body.embed.scrubbed #big { display:none; }
  body.embed #bar { width:100%; padding:6px 10px; box-sizing:border-box; background:#1b1d1f; font-size:12px; }
</style>
</head>
<body>
<div id="stage"><button id="big" type="button" aria-label="Play the film"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg></button><svg id="svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" text-rendering="geometricPrecision"></svg></div>
<div id="bar"><button id="play">play</button><input id="scrub" type="range" min="0" max="170" step="0.0333" value="0" aria-label="where in the film"><span id="tc">0.0</span><button id="sound" title="the sound is made here, from the film's cues">sound</button></div>
<script id="film">
/* film.js, inlined by build.mjs — edit film.js, then run it */
// The soft-launch film as code: one composition, a pure function of time.
//
//   const film = dynaFilm({ url });   // url: the address the end card names (default: the live app's)
//   film.frame(t)                     // the SVG inside a <svg viewBox="0 0 1920 1080"> at t seconds
//   film.DURATION, film.CUES          // the length, and the sound's cues (sound.mjs / synth.js make the sound)
//
// No page in it: launch-video/index.html plays and scrubs it, render.mjs renders it to MP4, the whitepaper embeds
// that page, and the example board *The film and the storyboard* runs this file inside a program on the canvas
// (scripts/examples.mjs inlines it). One copy of the film, wherever it plays. It needs the IBM Plex Mono and Caveat
// faces loaded where it draws (fonts/), and a document to measure the hand's writing with.
function dynaFilm(opts) {
  'use strict';
  opts = opts || {};
  const W = 1920, H = 1080;
  // The address the end card names. The app lives here today; pass { url: 'dyna.ink' } once N4 makes it the address.
  const APP_URL = opts.url || 'jjh111.github.io/MetaMedium/app';

  /* ---- tokens (brand/tokens.css, light) ---------------------------------- */
  const C = {
    paper:'#f8f5ef', plate:'#fdfbf6', well:'#efeae0', edge:'#e5ded1', rule:'#ded6c8',
    ink:'#0c1a24', ink2:'#33424b', ink3:'#66737c', ink4:'#9aa3a7',
    teal:'#0b6f7d', tealSoft:'#3fa3ae', read:'#1c5fb8', held:'#7b8a94', mid:'#a3761c', low:'#a8493c', model:'#6b4fa8',
    ghost:'#8ea3ad', clean:'#1c5fb8', gone:'#a8493c',
  };
  const MONO = "'IBM Plex Mono', monospace", HAND = "'Caveat', cursive";

  /* ---- time ---------------------------------------------------------------- */
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, k) => a + (b - a) * k;
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const ease = e => e < .5 ? 4 * e * e * e : 1 - Math.pow(-2 * e + 2, 3) / 2;
  const easeOut = e => 1 - Math.pow(1 - e, 3);
  const back = e => { const c = 1.70158; return 1 + (c + 1) * Math.pow(e - 1, 3) + c * Math.pow(e - 1, 2); };
  const fade = (t, a, b, c = Infinity, d = Infinity) => c === Infinity ? seg(t, a, b) : Math.min(seg(t, a, b), 1 - seg(t, c, d));
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const f1 = n => Math.round(n * 100) / 100; // two places: a tenth of a pixel stepped visibly on slow moves

  /* ---- colour: OKLCH → sRGB (V1-SPEC §3.3) --------------------------------- */
  function oklch(L, Cc, h) {
    const a = Cc * Math.cos(h * Math.PI / 180), b = Cc * Math.sin(h * Math.PI / 180);
    const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
    const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
    const s = (L - 0.0894841775 * a - 1.2914855480 * b) ** 3;
    const lin = [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
                -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
                -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s];
    const g = x => { x = clamp(x); return Math.round(255 * (x <= 0.0031308 ? 12.92 * x : 1.055 * x ** (1 / 2.4) - 0.055)); };
    return `rgb(${g(lin[0])},${g(lin[1])},${g(lin[2])})`;
  }
  const INK_LCH = [0.22, 0.03, 235];
  function mixLch(a, b, k) {
    let dh = ((b[2] - a[2] + 540) % 360) - 180;
    return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), a[2] + dh * k];
  }
  // The kinds of the notes scene. Hue is the kind, lightness depth, chroma how sure.
  const KIND = {
    idea:        [0.56, 0.15, 52],   // "it's an idea · orange"
    ideaOffered: [0.66, 0.06, 52],   // offered by nearness: the same hue, muted
    insight:     [0.70, 0.12, 52],   // a kind of idea: a step toward the ground
    evidence:    [0.55, 0.13, 150],  // evidence opposes assumption:
    assumption:  [0.52, 0.14, 330],  //   complementary hues, across the wheel
  };

  /* ---- the hand ------------------------------------------------------------ */
  function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function densify(pts, step = 5) {
    const out = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      const [ax, ay] = pts[i - 1], [bx, by] = pts[i]; const d = Math.hypot(bx - ax, by - ay); const n = Math.max(1, Math.ceil(d / step));
      for (let k = 1; k <= n; k++) out.push([ax + (bx - ax) * k / n, ay + (by - ay) * k / n]);
    }
    return out;
  }
  // A hand's line: the ideal path, densified, with slow seeded waves across it — the corpus's tremor, by eye.
  function hand(base, seed, amp = 2.2) {
    const r = rng(seed), p = densify(base, 4); const ph = [r() * 6.28, r() * 6.28, r() * 6.28]; const fq = [0.011 + r() * 0.006, 0.034 + r() * 0.01, 0.09 + r() * 0.03];
    let s = 0; const out = [];
    for (let i = 0; i < p.length; i++) {
      if (i) s += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
      const a = p[Math.max(0, i - 1)], b = p[Math.min(p.length - 1, i + 1)]; let nx = -(b[1] - a[1]), ny = b[0] - a[0]; const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
      const w = amp * (Math.sin(s * fq[0] + ph[0]) * 0.6 + Math.sin(s * fq[1] + ph[1]) * 0.3 + Math.sin(s * fq[2] + ph[2]) * 0.12);
      out.push([p[i][0] + nx * w, p[i][1] + ny * w]);
    }
    return out;
  }
  const ellipsePts = (cx, cy, rx, ry, a0 = -2.2, over = 0.12, n = 90) => { const o = []; for (let i = 0; i <= n; i++) { const a = a0 + (Math.PI * 2 + over) * i / n; o.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); } return o; };
  const rectPts = (cx, cy, w, h) => { const x = cx - w / 2, y = cy - h / 2; return [[x + 6, y - 2], [x + w, y], [x + w + 2, y + h], [x, y + h + 1], [x - 1, y + 4], [x + 14, y - 1]]; };
  const diamondPts = (cx, cy, w, h) => [[cx - 3, cy - h / 2 - 2], [cx + w / 2, cy], [cx, cy + h / 2], [cx - w / 2, cy], [cx + 4, cy - h / 2 + 3]];
  const ovalPts = (cx, cy, w, h) => { const r = h / 2, o = []; for (let i = 0; i <= 22; i++) { const a = -Math.PI / 2 + Math.PI * i / 22; o.push([cx + w / 2 - r + r * Math.cos(a), cy + r * Math.sin(a)]); } for (let i = 0; i <= 22; i++) { const a = Math.PI / 2 + Math.PI * i / 22; o.push([cx - w / 2 + r + r * Math.cos(a), cy + r * Math.sin(a)]); } o.push([cx + w / 2 - r + 8, cy - r - 1]); return o; };
  function arrowStrokes(a, b, seed, barb = 18) {
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    const w1 = [b[0] - barb * Math.cos(ang - 0.5), b[1] - barb * Math.sin(ang - 0.5)], w2 = [b[0] - barb * Math.cos(ang + 0.5), b[1] - barb * Math.sin(ang + 0.5)];
    return [hand([a, b, w1], seed, 1.6), hand([b, w2], seed + 7, 0.6)];
  }
  function partial(pts, p) {
    if (p >= 1) return pts; if (p <= 0) return [];
    const f = p * (pts.length - 1), i = Math.floor(f), k = f - i; const o = pts.slice(0, i + 1);
    if (i + 1 < pts.length) o.push([lerp(pts[i][0], pts[i + 1][0], k), lerp(pts[i][1], pts[i + 1][1], k)]);
    return o;
  }
  const dOf = pts => pts.length ? 'M' + pts.map(q => f1(q[0]) + ' ' + f1(q[1])).join('L') : '';
  function ink(pts, p, { color = C.ink, w = 3.4, o = 1, tip = true, dash = '' } = {}) {
    const q = partial(pts, p); if (q.length < 2 || o <= 0) return '';
    let s = `<path d="${dOf(q)}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" opacity="${o}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
    if (tip && p < 1) { const e = q[q.length - 1]; s += penTip(e[0], e[1]); }
    return s;
  }
  const penTip = (x, y, color = C.ink) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="11" fill="${color}" opacity="0.08"/><circle cx="${f1(x)}" cy="${f1(y)}" r="4.2" fill="${color}"/>`;
  // Several strokes drawn one after another over [a, b], each given time by its length.
  function drawSeq(strokes, t, a, b, opts = {}) {
    const lens = strokes.map(s => s.length), tot = lens.reduce((x, y) => x + y, 0); let acc = 0, out = '';
    for (let i = 0; i < strokes.length; i++) {
      const s0 = a + (b - a) * acc / tot, s1 = a + (b - a) * (acc + lens[i]) / tot; acc += lens[i];
      out += ink(strokes[i], seg(t, s0, s1), opts);
    }
    return out;
  }

  /* ---- text ---------------------------------------------------------------- */
  let DEFS = [], uid = 0;
  const measureCtx = document.createElement('canvas').getContext('2d');
  const MEASURED = new Map();
  function handWidth(text, size) { const k = text + '|' + size; if (!MEASURED.has(k)) { measureCtx.font = `600 ${size}px Caveat`; MEASURED.set(k, measureCtx.measureText(text).width); } return MEASURED.get(k); }
  function mono(x, y, text, { size = 22, color = C.ink, weight = 400, anchor = 'start', o = 1, ls = 0, italic = false } = {}) {
    if (o <= 0 || text === '') return '';
    return `<text x="${f1(x)}" y="${f1(y)}" font-family="${MONO}" font-size="${size}" font-weight="${weight}" fill="${color}" text-anchor="${anchor}" opacity="${o}"${ls ? ` letter-spacing="${ls}"` : ''}${italic ? ' font-style="italic"' : ''}>${esc(text)}</text>`;
  }
  // Writing by hand: the words revealed left to right with the pen at the edge.
  function writing(x, y, text, size, p, { color = C.ink, o = 1, anchor = 'start', tip = true } = {}) {
    if (p <= 0 || o <= 0) return '';
    const w = handWidth(text, size), x0 = anchor === 'middle' ? x - w / 2 : x; const id = 'c' + (uid++);
    const rw = (w + size * 0.3) * easeOut(clamp(p));
    DEFS.push(`<clipPath id="${id}"><rect x="${f1(x0 - size * 0.2)}" y="${f1(y - size * 1.2)}" width="${f1(rw)}" height="${f1(size * 1.7)}"/></clipPath>`);
    let s = `<text x="${f1(x0)}" y="${f1(y)}" font-family="${HAND}" font-size="${size}" font-weight="600" fill="${color}" opacity="${o}" clip-path="url(#${id})">${esc(text)}</text>`;
    if (tip && p < 1) s += penTip(x0 - size * 0.2 + rw, y - size * 0.25 + Math.sin(p * 40) * size * 0.12);
    return s;
  }
  const typed = (text, p) => text.slice(0, Math.round(text.length * clamp(p)));
  const monoW = (text, size) => text.length * size * 0.6;

  /* ---- the surface's components ------------------------------------------ */
  function chip(x, y, text, { o = 1, kind = 'match', size = 19, sub = '' } = {}) {
    if (o <= 0) return '';
    const col = kind === 'model' ? C.model : kind === 'held' ? C.held : kind === 'read' ? C.read : C.teal;
    const all = text + (sub ? '  ' + sub : ''); const w = monoW(all, size) + 26, h = size + 16;
    return `<g opacity="${o}"><rect data-box="1" x="${f1(x)}" y="${f1(y - h / 2)}" width="${f1(w)}" height="${h}" rx="${h / 2}" fill="${C.plate}" stroke="${col}" stroke-width="1.6"${kind === 'held' || kind === 'model' ? ' stroke-dasharray="5 4"' : ''}/>`
      + `<text x="${f1(x + 13)}" y="${f1(y + size * 0.36)}" font-family="${MONO}" font-size="${size}" fill="${col}">${esc(text)}${sub ? `<tspan fill="${C.ink3}">  ${esc(sub)}</tspan>` : ''}</text></g>`;
  }
  function selection(x, y, w, h, o) {
    if (o <= 0) return '';
    let s = `<g opacity="${o}"><rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" fill="none" stroke="${C.teal}" stroke-width="1.6" stroke-dasharray="7 6" rx="4"/>`;
    for (const [cx, cy] of [[x, y], [x + w, y], [x, y + h], [x + w, y + h]]) s += `<rect x="${f1(cx - 6)}" y="${f1(cy - 6)}" width="12" height="12" fill="${C.plate}" stroke="${C.teal}" stroke-width="1.6"/>`;
    s += `<line x1="${f1(x + w / 2)}" y1="${f1(y)}" x2="${f1(x + w / 2)}" y2="${f1(y - 26)}" stroke="${C.teal}" stroke-width="1.4"/><circle cx="${f1(x + w / 2)}" cy="${f1(y - 32)}" r="6.5" fill="${C.plate}" stroke="${C.teal}" stroke-width="1.6"/></g>`;
    return s;
  }
  function holdRing(x, y, t, a) { const k = seg(t, a, a + 0.7); if (k <= 0 || k >= 1) return ''; return `<circle cx="${x}" cy="${y}" r="${f1(14 + 46 * easeOut(k))}" fill="none" stroke="${C.teal}" stroke-width="2.4" opacity="${f1(1 - k)}"/>` + `<circle cx="${x}" cy="${y}" r="9" fill="${C.teal}" opacity="${f1(0.5 * (1 - k))}"/>`; }
  function tap(x, y, t, a) { const k = seg(t, a, a + 0.45); if (k <= 0 || k >= 1) return ''; return `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(8 + 26 * easeOut(k))}" fill="${C.teal}" opacity="${f1(0.28 * (1 - k))}"/>`; }
  function pill(x, y, label, { size = 18, state = 'offer', num = '', dot = false } = {}) {
    const text = label + (num ? ' ' + num : ''); const w = monoW(text, size) + 28 + (dot ? 14 : 0), h = size + 18;
    const on = state === 'on', reading = state === 'reading';
    const fill = on ? C.teal : C.plate, stroke = on ? C.teal : reading ? C.ink4 : C.rule, col = on ? C.plate : C.ink;
    let s = `<rect data-box="1" x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${h}" rx="${h / 2}" fill="${fill}" stroke="${stroke}" stroke-width="1.4"/>`;
    s += `<text x="${f1(x + 14)}" y="${f1(y + h / 2 + size * 0.36)}" font-family="${MONO}" font-size="${size}" fill="${col}">${esc(label)}${num ? `<tspan fill="${on ? C.plate : C.ink3}"> ${esc(num)}</tspan>` : ''}</text>`;
    if (dot) s += `<circle cx="${f1(x + w - 16)}" cy="${f1(y + h / 2)}" r="4" fill="${C.model}"/>`;
    return { s, w, h };
  }
  // The field: one input, what Enter will do, the four core buttons, what this is, what it affords.
  function field(x, y, { o = 1, scale = 1, text = '', caret = true, line = '', reads = [], offers = [], width = 560 } = {}) {
    if (o <= 0) return '';
    const rowW = (items, isRead) => items.reduce((a, r) => a + pill(0, 0, r.label, { num: isRead ? r.num : '', size: 17, dot: r.dot }).w + 8, 0);
    width = Math.max(width, 120 + rowW(reads, true) + 12, 120 + rowW(offers, false) + 12, 36 + monoW(text, 21) + 20, 36 + monoW(line, 16));
    const k = 1; let s = `<g opacity="${clamp(o)}" transform="translate(${f1(x)} ${f1(y)}) scale(${(scale * k).toFixed(4)})">`;
    const h = 206; s += `<rect data-box="1" x="0" y="0" width="${width}" height="${h}" rx="10" fill="${C.plate}" stroke="${C.edge}" stroke-width="1.4"/><rect x="0" y="2" width="${width}" height="${h}" rx="10" fill="none" stroke="rgba(12,26,36,0.05)" stroke-width="3"/>`;
    s += `<rect data-box="1" x="16" y="16" width="${width - 32}" height="44" rx="6" fill="${C.paper}" stroke="${C.rule}" stroke-width="1.2"/>`;
    s += mono(30, 46, text || '', { size: 21, color: C.ink });
    if (caret) s += `<rect x="${f1(30 + monoW(text, 21) + 2)}" y="27" width="2" height="24" fill="${C.teal}"/>`;
    s += mono(18, 84, line, { size: 16, color: C.teal });
    // the four core buttons
    const core = ['name', 'copy', 'paste', 'erase'];
    core.forEach((c, i) => { const cx = 36 + (i % 2) * 44, cy = 122 + Math.floor(i / 2) * 46; s += `<circle cx="${cx}" cy="${cy}" r="18" fill="${C.paper}" stroke="${C.rule}" stroke-width="1.3"/>` + icon(c, cx, cy); });
    let px = 120; for (const r of reads) { const p = pill(px, 100, r.label, { state: r.on ? 'on' : 'reading', num: r.num, size: 17 }); s += p.s; px += p.w + 8; }
    px = 120; for (const r of offers) { const p = pill(px, 148, r.label, { state: r.on ? 'on' : 'offer', size: 17, dot: r.dot }); s += p.s; px += p.w + 8; }
    return s + '</g>';
  }
  function icon(kind, cx, cy) {
    const st = `stroke="${C.ink3}" stroke-width="1.6" fill="none" stroke-linecap="round"`;
    if (kind === 'name') return `<path d="M${cx - 7} ${cy + 6} L${cx - 7} ${cy - 6} L${cx + 7} ${cy + 6} L${cx + 7} ${cy - 6}" ${st}/>`;
    if (kind === 'copy') return `<rect x="${cx - 7}" y="${cy - 7}" width="10" height="10" ${st}/><rect x="${cx - 3}" y="${cy - 3}" width="10" height="10" ${st}/>`;
    if (kind === 'paste') return `<rect x="${cx - 6}" y="${cy - 6}" width="12" height="13" ${st}/><path d="M${cx - 3} ${cy - 8} h6" ${st}/>`;
    return `<path d="M${cx - 7} ${cy - 5} l4 -2 l3 5 l3 -5 l4 2" ${st}/><path d="M${cx - 6} ${cy + 3} h12" ${st}/>`;
  }
  function card(x, y, w, head, body, { o = 1, color = C.model, buttons = null, kept = 0 } = {}) {
    if (o <= 0) return '';
    const lines = body, h = 60 + lines.length * 36 + (buttons ? 52 : 0);
    const border = kept > 0 ? `rgb(${Math.round(lerp(123, 28, kept))},${Math.round(lerp(138, 95, kept))},${Math.round(lerp(148, 184, kept))})` : C.held;

  const S1 = (() => {

  /* 03 — diagram: a flowchart read, written as Mermaid, tidied and routed. 04 — it runs. */
  const FX = 4800;
  const NODES = {
    start:   { kind: 'oval',    w: 170, h: 66,  messy: [-34, -346], tidy: [0, -330], label: 'start' },
    signup:  { kind: 'box',     w: 230, h: 86,  messy: [28, -186],  tidy: [0, -180], label: 'sign up' },
    paid:    { kind: 'diamond', w: 230, h: 150, messy: [-46, 8],    tidy: [0, 20],   label: 'paid?' },
    welcome: { kind: 'box',     w: 230, h: 86,  messy: [38, 252],   tidy: [0, 240],  label: 'welcome' },
    remind:  { kind: 'box',     w: 210, h: 86,  messy: [318, 62],   tidy: [340, 20], label: 'remind' },
  };
  const EDGES = [
    { id: 'e0', a: 'start', b: 'signup', how: 'down' }, { id: 'e1', a: 'signup', b: 'paid', how: 'down' },
    { id: 'e2', a: 'paid', b: 'welcome', how: 'down', word: 'yes' }, { id: 'e3', a: 'paid', b: 'remind', how: 'right', word: 'no' },
    { id: 'e4', a: 'remind', b: 'signup', how: 'back' },
  ];

  function nodeShape(n, c) { const N = NODES[n]; return N.kind === 'oval' ? ovalPts(c[0], c[1], N.w, N.h) : N.kind === 'diamond' ? diamondPts(c[0], c[1], N.w, N.h) : rectPts(c[0], c[1], N.w, N.h); }

    if (e.how === 'down') return [[A.bottom[0], A.bottom[1] + g], [B.top[0], B.top[1] - g]];
    if (e.how === 'right') return [[A.right[0] + g, A.right[1]], [B.left[0] - g, B.left[1]]];
    return [[B.right[0] + g * 0 + 0, B.right[1]], [B.right[0], B.right[1]]]; // unused: back edges route below
  }
  // Orthogonal routes between ports, as D7 draws them: out along each port's normal, fewest turns.
  function route(e, k) {
    const A = ports(e.a, nodeAt(e.a, k)), B = ports(e.b, nodeAt(e.b, k)), g = 10;
    if (e.how === 'down') { const a = [A.bottom[0], A.bottom[1] + g], b = [B.top[0], B.top[1] - g]; if (Math.abs(a[0] - b[0]) < 1) return [a, b]; const my = (a[1] + b[1]) / 2; return [a, [a[0], my], [b[0], my], b]; }
    if (e.how === 'right') { const a = [A.right[0] + g, A.right[1]], b = [B.left[0] - g, B.left[1]]; if (Math.abs(a[1] - b[1]) < 1) return [a, b]; const mx = (a[0] + b[0]) / 2; return [a, [mx, a[1]], [mx, b[1]], b]; }
    const a = [A.top[0], A.top[1] - g], b = [B.right[0] + g, B.right[1]]; return [a, [a[0], b[1]], b];
  }
  function handArrow(e, k) {
    const A = ports(e.a, nodeAt(e.a, k)), B = ports(e.b, nodeAt(e.b, k)), g = 12; let a, b;
    if (e.how === 'down') { a = [A.bottom[0] + 6, A.bottom[1] + g]; b = [B.top[0] - 4, B.top[1] - g]; }
    else if (e.how === 'right') { a = [A.right[0] + g, A.right[1] + 4]; b = [B.left[0] - g, B.left[1] - 2]; }
    else { a = [A.top[0] - 10, A.top[1] - g]; b = [B.right[0] + g + 6, B.right[1] + 14]; }
    return arrowStrokes(a, b, 50 + EDGES.indexOf(e) * 3);
  }
  function polyLen(p) { let l = 0; for (let i = 1; i < p.length; i++) l += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return l; }

    const endFade = seg(t, DURATION - 0.8, DURATION);
    const hud = v === null ? 0 : seg(t, DEMO0, DEMO0 + 0.5) * (1 - seg(v, 88.6, 89.4));
    const inside = t >= TECH1 - 0.2 && t < NAME_T;
    return (
      `<defs><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="rgba(90,72,44,0.07)" stroke-width="1"/></pattern>${DEFS.join('')}</defs>`
      + `<rect width="${W}" height="${H}" fill="${C.paper}"/>`
      + `<g opacity="${f1(mainO)}" transform="${camT(cam)}">${gridRect(cam)}<g id="world">${world}</g></g>`
      + (v === null ? '' : devices(v, gridRect))
      + mono(64, 74, 'dyna.ink', { size: 22, color: C.ink3, weight: 500, o: hud })
      + (v === null ? captions(t, HCAPS) : inside ? captions(t, TCAPS) : captions(v) + statusLine(v))
      + (endFade > 0 ? `<rect width="${W}" height="${H}" fill="${C.paper}" opacity="${f1(endFade)}"/>` : ''));
  }

  /* ---- the sound's cues: what happens when, for sound.mjs to synthesise ---- */
  // Each cue is { t (film seconds), kind, dur?, note?, gain? }. History beats are timed from their beat, the inside from
  // TECH1/TECH2, and the demo in v1 seconds through unwarp, so the sound moves with the picture whenever the timing does.
  // A chime's note is a step of D major's pentatonic scale (0 = D5); quiet by design — emphasis, never a soundtrack.
  const CUES = (() => {
    const out = [], at = (t, kind, o = {}) => { if (t !== null && t >= 0) out.push({ t: Math.round(t * 1000) / 1000, kind, ...o }); };
    const H = (i, L, kind, o) => at(B(i) + L, kind, o);
    const V = (v, kind, o = {}) => { const t = unwarp(v); if (t === null) return; const d = o.to !== undefined ? unwarp(o.to) : null; const { to, ...rest } = o; at(t, kind, d !== null ? { ...rest, dur: Math.round((d - t) * 1000) / 1000 } : rest); };
    SHOTS.slice(1).forEach(s => at(s[0], 'whoosh', { dur: PAN }));
    // the timeline: a soft bell as each year lights
    BEATS.slice(0, 9).forEach((b, i) => at(b[0] + 0.15, 'tick', { note: i % 5, gain: 0.6 }));
    H(0, 0.2, 'pen', { dur: 1.4 }); H(0, 1.3, 'pen', { dur: 1.6, gain: 0.6 }); H(0, 2.9, 'chime', { note: 0 });
    H(1, 0.4, 'pen', { dur: 2.2, gain: 0.5 }); H(1, 3.0, 'snap', { note: 3 }); H(1, 3.5, 'chime', { note: 2 });
    H(2, 0.3, 'pen', { dur: 1.9 }); H(2, 2.2, 'pen', { dur: 0.8, gain: 0.8 }); H(2, 3.0, 'chime', { note: 4 });
    H(3, 0.2, 'pen', { dur: 0.5 }); H(3, 1.5, 'tap'); H(3, 2.3, 'whoosh', { dur: 0.8, gain: 0.5 }); H(3, 3.1, 'pop');
    H(4, 0.3, 'pen', { dur: 1.7 }); H(4, 2.3, 'snap', { note: 1 }); H(4, 3.3, 'tap'); H(4, 3.9, 'slide', { dur: 0.7 });
    H(5, 0.3, 'pen', { dur: 1.3 }); H(5, 2.0, 'snap', { note: 2 }); H(5, 2.4, 'chime', { note: 4 });
    H(6, 0.3, 'pen', { dur: 0.8 }); H(6, 1.2, 'snap', { note: 0 }); H(6, 1.7, 'type', { dur: 2.2, gain: 0.5 });
    H(7, 0.6, 'pen', { dur: 1.7 }); H(7, 2.4, 'hmm'); H(7, 3.4, 'scratch', { dur: 1.4 }); H(7, 4.9, 'erase'); H(7, 5.9, 'chime', { note: 2 }); H(7, 6.2, 'pop');
    H(8, 0.3, 'pen', { dur: 1.3 }); H(8, 2.2, 'pen', { dur: 1.0, gain: 0.7 }); H(8, 2.5, 'chime', { note: 3 });
    H(9, 0.3, 'resolve', { gain: 0.8 });
    // inside: the rungs, then the tiers
    at(TECH1 + 0.4, 'pen', { dur: 1.1 }); [0, 1, 2].forEach(i => at(TECH1 + 1.8 + i * 0.25, 'tick', { note: i })); [0, 1, 2].forEach(i => at(TECH1 + 3.2 + i * 0.2, 'tick', { note: 2 + i }));
    at(TECH1 + 4.6, 'type', { dur: 0.7 }); at(TECH1 + 5.4, 'chime', { note: 3 });
    [0, 1, 2].forEach(i => at(TECH2 + 0.4 + i * 0.7, 'pop', { gain: 0.7 })); at(TECH2 + 3.6, 'chime', { note: 4 });
    // 01 read
    V(0.6, 'pen', { to: 1.8 }); V(2.0, 'chime', { note: 0 }); V(2.6, 'snap', { note: 3 });
    V(3.6, 'pen', { to: 4.8 }); [0, 1, 2, 3, 4].forEach(i => V(5.0 + i * 0.07, 'tick', { note: i, gain: 0.5 }));
    [0, 1, 2, 3, 4].forEach(i => V(5.8 + i * 0.1, 'tick', { note: 4 - i, gain: 0.4 })); V(6.5, 'snap', { note: 4 }); V(7.0, 'chime', { note: 2 });
    V(7.8, 'pen', { to: 8.8 }); V(9.0, 'hmm');
    // 02 name
    V(11.4, 'pen', { to: 13.6 }); V(14.0, 'tap'); V(14.5, 'pop', { gain: 0.6 }); V(15.0, 'type', { to: 15.8 }); V(16.0, 'tap');
    V(16.6, 'chime', { note: 1, gain: 0.7 }); V(16.75, 'chime', { note: 3, gain: 0.5 }); V(17.6, 'tap'); V(17.8, 'snap', { note: 0 });
    V(18.2, 'chime', { note: 2 }); V(18.8, 'tick', { note: 4, gain: 0.5 }); V(19.2, 'chime', { note: 4 }); V(20.0, 'pen', { to: 21.8 });
    V(22.2, 'chime', { note: 3 }); V(22.7, 'snap', { note: 1 });
    // 03 diagram, 04 run
    V(25.6, 'pen', { to: 31.9 }); V(32.0, 'chime', { note: 0 }); V(33.0, 'tap'); V(33.7, 'type', { to: 36.0 }); V(36.1, 'tap');
    V(36.7, 'slide', { to: 38.3 }); V(38.3, 'chime', { note: 2 }); V(41.7, 'tap');
    RUN.forEach(([, a], i) => V(a, 'tick', { note: [0, 1, 2, 3, 1, 4][i] })); V(48.7, 'chime', { note: 5 });
    // 05 kinds, 06 arrange, 07 together
    V(51.0, 'pen', { to: 54.3, gain: 0.8 }); V(54.2, 'pop', { gain: 0.6 }); V(56.2, 'chime', { note: 1 }); V(58.3, 'tap'); V(58.6, 'chime', { note: 2 });
    V(60.6, 'chime', { note: 3 }); V(62.6, 'chime', { note: 4 }); V(65.4, 'tap'); V(66.1, 'slide', { to: 67.0 }); V(67.4, 'pop'); V(67.6, 'pop', { gain: 0.7 });
    V(73.3, 'pen', { to: 75.0, gain: 0.6 }); V(75.2, 'pop', { gain: 0.6 }); V(77.25, 'tap'); V(77.4, 'chime', { note: 5 });
    V(79.3, 'tick', { note: 2 }); V(80.0, 'tick', { note: 4, gain: 0.6 });
    // the end card
    V(89.4, 'pen', { to: 91.0 }); V(91.0, 'resolve'); V(92.9, 'tick', { note: 0, gain: 0.6 });
    return out.sort((a, b) => a.t - b.t);
  })();

  return { W, H, DURATION, CUES, frame: render, camAt: camAt2, remeasure: () => MEASURED.clear() };
}
if (typeof module === 'object' && module.exports) module.exports = dynaFilm;

<script id="synth" type="text/plain">
/* synth.js, inlined by build.mjs — edit synth.js, then run it */
// The film's sound, synthesised from its cues: no samples, no dependencies, the same samples every run.
//
//   dynaSynth(cues, duration) → { left, right, gain, sampleRate, peakDb }   (Float32Arrays; multiply by gain to play)
//
// A plain script, so the browser runs it too (launch-video/index.html builds the sound in a worker on the first play)
// and Node reads it through sound.mjs, which writes the WAV render.mjs lays under the picture.
// Quiet by design: a soft bed under the whole film, and short emphasis where the picture acts —
// a pen's grain, a key, a tap, a clean form snapping in, a chime when something is read.
const SR = 48000;
const NOTES = [587.33, 659.25, 739.99, 880.0, 987.77, 1174.66, 1318.51]; // D major pentatonic from D5

function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// a state-variable filter: one sample at a time, its centre free to move
function svf() { let lo = 0, bp = 0; return (x, fc, q) => { const f = 2 * Math.sin(Math.PI * Math.min(fc, SR / 6) / SR); const hp = x - lo - bp / q; bp += f * hp; lo += f * bp; return { lo, bp, hp }; }; }

function dynaSynth(cues, duration, { seed = 7 } = {}) {
  const n = Math.ceil((duration + 0.5) * SR);
  const L = new Float32Array(n), R = new Float32Array(n), send = new Float32Array(n);
  const r = rng(seed), noise = () => r() * 2 - 1;
  const put = (i, v, pan = 0, wet = 0) => { if (i < 0 || i >= n) return; L[i] += v * (1 - pan) ; R[i] += v * (1 + pan); send[i] += v * wet; };
  const env = (u, a, d) => Math.min(1, u / a) * Math.exp(-u / d); // attack then exponential decay (seconds)

  const voices = {
    pen(c) { // paper grain: band-passed noise whose speed wavers like a hand's
      const d = c.dur || 1, f = svf(), g = 0.022 * (c.gain ?? 1); let sp = 0.7;
      for (let k = 0; k < d * SR; k++) { const u = k / SR; if (k % 480 === 0) sp += (0.75 + 0.25 * Math.sin(u * 9.1) - sp) * 0.5 + (r() - 0.5) * 0.15;
        const e = Math.min(1, u / 0.04, (d - u) / 0.06) * sp, y = f(noise(), 2600 + 900 * sp, 1.1).bp; put(Math.round(c.t * SR) + k, y * g * e, -0.1); }
    },
    type(c) { // keys: a short tick each ~75 ms
      const d = c.dur || 1, g = 0.05 * (c.gain ?? 1); let u = 0;
      while (u < d) { const i0 = Math.round((c.t + u) * SR), f = svf(), pan = (r() - 0.5) * 0.3, hz = 1700 + r() * 500;
        for (let k = 0; k < 0.03 * SR; k++) { const v = k / SR; put(i0 + k, g * (0.6 * f(noise(), 4000, 0.8).hp * Math.exp(-v / 0.004) + 0.4 * Math.sin(2 * Math.PI * hz * v) * Math.exp(-v / 0.012)), pan); }
        u += 0.06 + r() * 0.04; }
    },
    tick(c) { // a small glass bell
      const hz = NOTES[(c.note ?? 0) % NOTES.length] * 2, g = 0.035 * (c.gain ?? 1), i0 = Math.round(c.t * SR);
      for (let k = 0; k < 0.5 * SR; k++) { const u = k / SR; put(i0 + k, g * env(u, 0.002, 0.09) * (Math.sin(2 * Math.PI * hz * u) + 0.3 * Math.sin(2 * Math.PI * hz * 2.76 * u) * Math.exp(-u / 0.03)), 0.15, 0.5); }
    },
    chime(c) { // a soft bell: the fundamental and two partials, a long tail into the room
      const hz = NOTES[(c.note ?? 0) % NOTES.length], g = 0.06 * (c.gain ?? 1), i0 = Math.round(c.t * SR), pan = ((c.note ?? 0) % 2 ? 0.18 : -0.18);
      for (let k = 0; k < 2.2 * SR; k++) { const u = k / SR; put(i0 + k, g * env(u, 0.004, 0.7) * (Math.sin(2 * Math.PI * hz * u) + 0.35 * Math.sin(2 * Math.PI * hz * 2.01 * u) * Math.exp(-u / 0.25) + 0.12 * Math.sin(2 * Math.PI * hz * 3.02 * u) * Math.exp(-u / 0.12)), pan, 0.6); }
    },
    snap(c) { // a clean form arriving: a plucked string (Karplus–Strong) and a bright click
      const hz = NOTES[(c.note ?? 0) % NOTES.length], g = 0.09 * (c.gain ?? 1), i0 = Math.round(c.t * SR), P = Math.round(SR / hz), buf = Float32Array.from({ length: P }, () => noise());
      for (let k = 0; k < 0.7 * SR; k++) { const j = k % P, v = buf[j]; buf[j] = 0.5 * (v + buf[(j + 1) % P]) * 0.996; put(i0 + k, g * v * Math.min(1, (0.7 - k / SR) / 0.1), 0.05, 0.4); }
      for (let k = 0; k < 0.01 * SR; k++) put(i0 + k, g * 0.6 * noise() * Math.exp(-k / SR / 0.0015));
    },
    pop(c) { // something appears: a rising blip
      const g = 0.08 * (c.gain ?? 1), i0 = Math.round(c.t * SR); let ph = 0;
      for (let k = 0; k < 0.18 * SR; k++) { const u = k / SR, hz = 320 + 520 * Math.min(1, u / 0.05); ph += 2 * Math.PI * hz / SR; put(i0 + k, g * env(u, 0.003, 0.05) * Math.sin(ph), -0.05, 0.35); }
    },
    tap(c) { // a fingertip on glass: a woody knock
      const g = 0.11 * (c.gain ?? 1), i0 = Math.round(c.t * SR), f = svf(); let ph = 0;
      for (let k = 0; k < 0.12 * SR; k++) { const u = k / SR, hz = 520 - 160 * Math.min(1, u / 0.03); ph += 2 * Math.PI * hz / SR; put(i0 + k, g * (env(u, 0.001, 0.025) * Math.sin(ph) + 0.25 * f(noise(), 3000, 1).bp * Math.exp(-u / 0.004)), 0.1, 0.2); }
    },
    whoosh(c) { // the camera moving: filtered noise that rises and falls with the move
      const d = Math.max(0.3, c.dur || 0.65), g = 0.045 * (c.gain ?? 1), i0 = Math.round((c.t - 0.05) * SR), f = svf(), f2 = svf();
      for (let k = 0; k < (d + 0.25) * SR; k++) { const u = k / SR, p = Math.min(1, u / d), e = Math.sin(Math.PI * Math.min(1, u / (d + 0.25))) ** 2, fc = 350 + 1500 * Math.sin(Math.PI * p);
        const x = noise(); put(i0 + k, g * e * (f(x, fc, 0.9).bp * 0.8), -0.2 + 0.4 * p); put(i0 + k, g * e * 0.5 * f2(x, fc * 1.5, 0.7).bp, 0.2 - 0.4 * p); }
    },
    slide(c) { // things carried into place: a soft rising sweep
      const d = c.dur || 0.7, g = 0.03 * (c.gain ?? 1), i0 = Math.round(c.t * SR), f = svf();
      for (let k = 0; k < d * SR; k++) { const u = k / SR, p = u / d; put(i0 + k, g * Math.sin(Math.PI * p) * f(noise(), 600 + 1600 * p, 2.5).bp, 0, 0.3); }
    },
    scratch(c) { // a scratch-out: nine quick passes
      const d = c.dur || 1.4, g = 0.06 * (c.gain ?? 1), i0 = Math.round(c.t * SR), f = svf();
      for (let k = 0; k < d * SR; k++) { const u = k / SR, pass = (u / d) * 9, e = Math.sin(Math.PI * (pass % 1)) ** 2; put(i0 + k, g * e * f(noise(), 1400 + 500 * Math.sin(pass * Math.PI), 1.2).bp, 0.1 * Math.sin(pass * Math.PI)); }
    },
    erase(c) { // gone: a low, soft thump
      const g = 0.13 * (c.gain ?? 1), i0 = Math.round(c.t * SR), f = svf(); let ph = 0;
      for (let k = 0; k < 0.4 * SR; k++) { const u = k / SR, hz = 95 - 40 * Math.min(1, u / 0.2); ph += 2 * Math.PI * hz / SR; put(i0 + k, g * (env(u, 0.004, 0.11) * Math.sin(ph) + 0.3 * f(noise(), 400, 0.7).lo * Math.exp(-u / 0.05)), 0, 0.2); }
    },
    hmm(c) { // not sure: two soft notes stepping down
      const g = 0.05 * (c.gain ?? 1), i0 = Math.round(c.t * SR);
      [[440, 0], [369.99, 0.17]].forEach(([hz, at]) => { for (let k = 0; k < 0.5 * SR; k++) { const u = k / SR, s = Math.sin(2 * Math.PI * hz * u); put(i0 + Math.round(at * SR) + k, g * env(u, 0.015, 0.14) * (s + 0.2 * Math.sin(4 * Math.PI * hz * u)), 0, 0.4); } });
    },
    resolve(c) { // the name: an open D chord that blooms and settles
      const g = 0.045 * (c.gain ?? 1), i0 = Math.round(c.t * SR);
      [293.66, 440, 587.33, 739.99, 880].forEach((hz, j) => { const pan = (j - 2) * 0.15;
        for (let k = 0; k < 4.5 * SR; k++) { const u = k / SR, e = Math.min(1, u / 0.35) * Math.exp(-u / 1.6); put(i0 + Math.round(j * 0.06 * SR) + k, g * e * (Math.sin(2 * Math.PI * hz * u) + 0.15 * Math.sin(4 * Math.PI * hz * u)), pan, 0.6); } });
    },
  };
  for (const c of cues) { const v = voices[c.kind]; if (!v) throw new Error('no voice for cue kind ' + c.kind); v(c); }

  // the bed: an open fifth and a ninth, breathing slowly, fading in and out with the film
  const bed = [[146.83, 0.0], [220.0, 0.9], [329.63, 1.7], [147.2, 2.3], [219.6, 3.1]];
  for (let k = 0; k < n; k++) {
    const u = k / SR, e = Math.min(1, u / 4, Math.max(0, (duration - u) / 3)); let v = 0;
    for (const [hz, ph] of bed) v += Math.sin(2 * Math.PI * hz * u + ph) * (0.55 + 0.45 * Math.sin(2 * Math.PI * u / (11 + ph * 3) + ph));
    const b = 0.0055 * e * v; L[k] += b; R[k] += b * 0.97;
  }

  // the room: a small Schroeder reverb on what was sent to it
  const combs = [1557, 1617, 1491, 1422].map(d => ({ d, buf: new Float32Array(d), i: 0, fb: 0.78, lp: 0 }));
  const alls = [225, 556].map(d => ({ d, buf: new Float32Array(d), i: 0 }));
  for (let k = 0; k < n; k++) {
    let y = 0; for (const c of combs) { const o = c.buf[c.i]; c.lp = o * 0.7 + c.lp * 0.3; c.buf[c.i] = send[k] + c.lp * c.fb; c.i = (c.i + 1) % c.d; y += o; }
    y *= 0.25; for (const a of alls) { const o = a.buf[a.i], w = y + o * 0.5; a.buf[a.i] = w; a.i = (a.i + 1) % a.d; y = o - 0.5 * w; }
    L[k] += y * 0.32; R[k] += y * 0.3 * (k % 2 ? 1 : 0.98);
  }

  // master: a gentle soft clip, then peak at −3 dBFS
  let peak = 0; for (let k = 0; k < n; k++) { L[k] = Math.tanh(L[k] * 1.4) / 1.4; R[k] = Math.tanh(R[k] * 1.4) / 1.4; peak = Math.max(peak, Math.abs(L[k]), Math.abs(R[k])); }
  const gain = peak > 0 ? 0.708 / peak : 1;
  return { left: L, right: R, gain, sampleRate: SR, peakDb: 20 * Math.log10(peak), cues: cues.length };
}
if (typeof module === 'object' && module.exports) module.exports = dynaSynth;
</script>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const film = dynaFilm({ url: params.get('url') || undefined });
const DURATION = film.DURATION;
const svg = document.getElementById('svg');
function render(t) { svg.innerHTML = film.frame(t); }
window.render = render; window.DURATION = DURATION; window.CUES = film.CUES; window.__camAt = film.camAt;

/* ---- the player (absent when rendering) -------------------------------- */
// ?render: a bare 1920×1080 stage for render.mjs. ?embed: the stage fills its frame, the bar under it,
// for the whitepaper's film. ?t=: where it starts. ?poster=: the frame shown until it is first played (its poster).
const embed = params.has('embed');
if (params.has('render')) document.body.classList.add('render');
if (embed) document.body.classList.add('embed');
const scrub = document.getElementById('scrub'), tc = document.getElementById('tc'), playB = document.getElementById('play'), soundB = document.getElementById('sound');
scrub.max = DURATION;
let playing = false, t0 = 0, tAt = Number(params.get('t') || 0);
function show(t) { tAt = t; render(t); scrub.value = t; tc.textContent = t.toFixed(1) + ' / ' + DURATION.toFixed(0) + ' s'; }

// The sound: synth.js in a worker, built on the first play with sound on (browsers give sound only after a tap),
// then played from wherever the film stands and started again on every scrub, so it never drifts from the picture.
let audio = null, buffer = null, building = false, source = null, soundOn = true;
function stopSound() { if (source) { try { source.stop(); } catch (e) { /* already stopped */ } source.disconnect(); source = null; } }
function startSound() {
  stopSound();
  if (!soundOn || !buffer || !playing) return;
  source = audio.createBufferSource(); source.buffer = buffer; source.connect(audio.destination);
  source.start(0, Math.min(tAt, buffer.duration - 0.01));
}
function buildSound() {
  if (building || buffer || typeof Worker !== 'function') return;
  building = true; soundB.textContent = 'sound…';
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    audio = new AC({ sampleRate: 48000 });
    // synth.js is inlined above as text; the worker is that text and the few lines that run it.
    const body = document.getElementById('synth').textContent + `
onmessage = (e) => {
  const { cues, duration } = e.data;
  const { left, right, gain, sampleRate } = dynaSynth(cues, duration);
  for (let k = 0; k < left.length; k++) { left[k] *= gain; right[k] *= gain; }
  postMessage({ left, right, sampleRate }, [left.buffer, right.buffer]);
};`;
    const w = new Worker(URL.createObjectURL(new Blob([body], { type: 'text/javascript' })));
    w.onmessage = (e) => {
      const { left, right, sampleRate } = e.data;
      buffer = audio.createBuffer(2, left.length, sampleRate); buffer.copyToChannel(left, 0); buffer.copyToChannel(right, 1);
      building = false; w.terminate(); soundB.textContent = soundOn ? 'sound on' : 'sound off'; startSound();
    };
    w.onerror = () => { building = false; soundOn = false; soundB.textContent = 'no sound here'; };
    w.postMessage({ cues: film.CUES, duration: DURATION });
  } catch (e) { building = false; soundOn = false; soundB.textContent = 'no sound here'; }
}

function setPlaying(on) {
  playing = on; playB.textContent = on ? 'pause' : 'play'; document.body.classList.toggle('playing', on);
  if (on) {
    if (tAt >= DURATION - 0.05) tAt = 0;
    t0 = performance.now() - tAt * 1000; requestAnimationFrame(loop);
    if (!told) { told = true; tell('play'); }
    if (soundOn) { buildSound(); if (audio && audio.state === 'suspended') audio.resume(); startSound(); }
  } else stopSound();
}
scrub.addEventListener('input', () => { document.body.classList.add('scrubbed'); show(Number(scrub.value)); if (playing) { t0 = performance.now() - tAt * 1000; startSound(); } });
playB.addEventListener('click', () => setPlaying(!playing));
soundB.addEventListener('click', () => {
  soundOn = !soundOn; soundB.textContent = soundOn ? (buffer ? 'sound on' : 'sound') : 'sound off';
  if (soundOn && playing) { buildSound(); if (audio && audio.state === 'suspended') audio.resume(); startSound(); } else stopSound();
});
document.getElementById('stage').addEventListener('click', () => setPlaying(!playing));
// Held in a page (the whitepaper's film dialog): say the first play, and hand it Esc, which a focused frame keeps.
const held = embed && window.parent !== window;
let told = false;
function tell(what) { if (held) try { window.parent.postMessage({ dynaFilm: what }, location.origin); } catch (e) { /* a page of another origin hears nothing */ } }
document.addEventListener('keydown', e => { if (e.key === 'Escape') tell('close'); });
document.addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); } });
function loop(now) {
  if (!playing) return;
  let t = (now - t0) / 1000;
  if (t > DURATION) { t = 0; t0 = now; show(0); startSound(); } else show(t);
  requestAnimationFrame(loop);
}
// The faces are fetched from fonts/ beside this page; opened somewhere they cannot be (the file alone), the film is
// drawn in the browser's own faces rather than not at all — a face that fails, or takes past 3 s, is not waited on.
const face = (f) => document.fonts.load(f).catch(() => null);
const faces = Promise.all([face('600 40px Caveat'), face('400 20px "IBM Plex Mono"'), face('500 20px "IBM Plex Mono"')]);
Promise.race([faces, new Promise(r => setTimeout(r, 3000))]).then(() => { film.remeasure(); show(tAt); if (params.has('poster')) render(Number(params.get('poster'))); window.__ready = true; });
</script>
