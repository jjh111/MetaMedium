<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dyna.ink soft launch</title>
<!-- The soft-launch film: one composition, a pure function of time (render(t)).
     Scrub it here; render it to MP4 with `node launch-video/render.mjs`.
     Colours are brand/tokens.css's; the kinds' colours are OKLCH, as V1-SPEC §3.3 has it. -->
<style>
  /* Vendored (OFL-1.1), so a frame renders the same with no network: IBM Plex Mono, the brand's one face,
     and Caveat for the hand's own writing on the board — ink, never chrome. */
  @font-face { font-family: 'Caveat'; font-weight: 600; src: url('fonts/Caveat-600.ttf') format('truetype'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; src: url('fonts/IBMPlexMono-400.ttf') format('truetype'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; src: url('fonts/IBMPlexMono-500.ttf') format('truetype'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 600; src: url('fonts/IBMPlexMono-600.ttf') format('truetype'); }
  :root { --paper:#f8f5ef; --ink:#0c1a24; --ink-3:#66737c; --teal:#0b6f7d; --rule:#ded6c8; }
  html, body { margin:0; background:#1b1d1f; height:100%; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; font-family:'IBM Plex Mono', monospace; color:#ddd; }
  #stage { width:min(96vw, calc((100vh - 70px) * 16 / 9)); aspect-ratio:16/9; background:var(--paper); box-shadow:0 8px 40px rgba(0,0,0,.4); }
  #stage svg { width:100%; height:100%; display:block; }
  #bar { display:flex; gap:12px; align-items:center; width:min(96vw, calc((100vh - 70px) * 16 / 9)); font-size:13px; }
  #bar input[type=range] { flex:1; }
  #bar button { font:inherit; background:#333; color:#eee; border:1px solid #555; border-radius:4px; padding:4px 10px; cursor:pointer; }
  body.render { background:var(--paper); display:block; }
  body.render #stage { width:1920px; height:1080px; box-shadow:none; }
  body.render #bar { display:none; }
</style>
</head>
<body>
<div id="stage"><svg id="svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="bar"><button id="play">play</button><input id="scrub" type="range" min="0" max="156" step="0.0333" value="0"><span id="tc">0.00</span></div>
<script>
'use strict';
const W = 1920, H = 1080, DURATION = 156;
const params = new URLSearchParams(location.search);
// The address the end card names. The app lives here today; pass ?url=dyna.ink once N4 makes it the address.
const APP_URL = params.get('url') || 'jjh111.github.io/MetaMedium/app';

/* ---- tokens (brand/tokens.css, light) ---------------------------------- */
const C = {
  paper:'#f8f5ef', plate:'#fdfbf6', well:'#efeae0', edge:'#e5ded1', rule:'#ded6c8',
  ink:'#0c1a24', ink2:'#33424b', ink3:'#66737c', ink4:'#9aa3a7',
  teal:'#0b6f7d', tealSoft:'#3fa3ae', read:'#1c5fb8', held:'#7b8a94', mid:'#a3761c', low:'#a8493c', model:'#6b4fa8',
  ghost:'#8ea3ad', clean:'#1c5fb8', gone:'#a8493c',
};
const MONO = "'IBM Plex Mono', monospace", HAND = "'Caveat', cursive";

/* ---- time ---------------------------------------------------------------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = e => e < .5 ? 4 * e * e * e : 1 - Math.pow(-2 * e + 2, 3) / 2;
const easeOut = e => 1 - Math.pow(1 - e, 3);
const back = e => { const c = 1.70158; return 1 + (c + 1) * Math.pow(e - 1, 3) + c * Math.pow(e - 1, 2); };
const fade = (t, a, b, c = Infinity, d = Infinity) => c === Infinity ? seg(t, a, b) : Math.min(seg(t, a, b), 1 - seg(t, c, d));
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const f1 = n => Math.round(n * 10) / 10;

/* ---- colour: OKLCH → sRGB (V1-SPEC §3.3) --------------------------------- */
function oklch(L, Cc, h) {
  const a = Cc * Math.cos(h * Math.PI / 180), b = Cc * Math.sin(h * Math.PI / 180);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.2914855480 * b) ** 3;
  const lin = [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
              -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
              -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s];
  const g = x => { x = clamp(x); return Math.round(255 * (x <= 0.0031308 ? 12.92 * x : 1.055 * x ** (1 / 2.4) - 0.055)); };
  return `rgb(${g(lin[0])},${g(lin[1])},${g(lin[2])})`;
}
const INK_LCH = [0.22, 0.03, 235];
function mixLch(a, b, k) {
  let dh = ((b[2] - a[2] + 540) % 360) - 180;
  return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), a[2] + dh * k];
}
// The kinds of the notes scene. Hue is the kind, lightness depth, chroma how sure.
const KIND = {
  idea:        [0.56, 0.15, 52],   // "it's an idea · orange"
  ideaOffered: [0.66, 0.06, 52],   // offered by nearness: the same hue, muted
  insight:     [0.70, 0.12, 52],   // a kind of idea: a step toward the ground
  evidence:    [0.55, 0.13, 150],  // evidence opposes assumption:
  assumption:  [0.52, 0.14, 330],  //   complementary hues, across the wheel
};

/* ---- the hand ------------------------------------------------------------ */
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function densify(pts, step = 5) {
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    const [ax, ay] = pts[i - 1], [bx, by] = pts[i]; const d = Math.hypot(bx - ax, by - ay); const n = Math.max(1, Math.ceil(d / step));
    for (let k = 1; k <= n; k++) out.push([ax + (bx - ax) * k / n, ay + (by - ay) * k / n]);
  }
  return out;
}
// A hand's line: the ideal path, densified, with slow seeded waves across it — the corpus's tremor, by eye.
function hand(base, seed, amp = 2.2) {
  const r = rng(seed), p = densify(base, 4); const ph = [r() * 6.28, r() * 6.28, r() * 6.28]; const fq = [0.011 + r() * 0.006, 0.034 + r() * 0.01, 0.09 + r() * 0.03];
  let s = 0; const out = [];
  for (let i = 0; i < p.length; i++) {
    if (i) s += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
    const a = p[Math.max(0, i - 1)], b = p[Math.min(p.length - 1, i + 1)]; let nx = -(b[1] - a[1]), ny = b[0] - a[0]; const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
    const w = amp * (Math.sin(s * fq[0] + ph[0]) * 0.6 + Math.sin(s * fq[1] + ph[1]) * 0.3 + Math.sin(s * fq[2] + ph[2]) * 0.12);
    out.push([p[i][0] + nx * w, p[i][1] + ny * w]);
  }
  return out;
}
const ellipsePts = (cx, cy, rx, ry, a0 = -2.2, over = 0.12, n = 90) => { const o = []; for (let i = 0; i <= n; i++) { const a = a0 + (Math.PI * 2 + over) * i / n; o.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); } return o; };
const rectPts = (cx, cy, w, h) => { const x = cx - w / 2, y = cy - h / 2; return [[x + 6, y - 2], [x + w, y], [x + w + 2, y + h], [x, y + h + 1], [x - 1, y + 4], [x + 14, y - 1]]; };
const diamondPts = (cx, cy, w, h) => [[cx - 3, cy - h / 2 - 2], [cx + w / 2, cy], [cx, cy + h / 2], [cx - w / 2, cy], [cx + 4, cy - h / 2 + 3]];
const ovalPts = (cx, cy, w, h) => { const r = h / 2, o = []; for (let i = 0; i <= 22; i++) { const a = -Math.PI / 2 + Math.PI * i / 22; o.push([cx + w / 2 - r + r * Math.cos(a), cy + r * Math.sin(a)]); } for (let i = 0; i <= 22; i++) { const a = Math.PI / 2 + Math.PI * i / 22; o.push([cx - w / 2 + r + r * Math.cos(a), cy + r * Math.sin(a)]); } o.push([cx + w / 2 - r + 8, cy - r - 1]); return o; };
function arrowStrokes(a, b, seed, barb = 18) {
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
  const w1 = [b[0] - barb * Math.cos(ang - 0.5), b[1] - barb * Math.sin(ang - 0.5)], w2 = [b[0] - barb * Math.cos(ang + 0.5), b[1] - barb * Math.sin(ang + 0.5)];
  return [hand([a, b, w1], seed, 1.6), hand([b, w2], seed + 7, 0.6)];
}
function partial(pts, p) {
  if (p >= 1) return pts; if (p <= 0) return [];
  const f = p * (pts.length - 1), i = Math.floor(f), k = f - i; const o = pts.slice(0, i + 1);
  if (i + 1 < pts.length) o.push([lerp(pts[i][0], pts[i + 1][0], k), lerp(pts[i][1], pts[i + 1][1], k)]);
  return o;
}
const dOf = pts => pts.length ? 'M' + pts.map(q => f1(q[0]) + ' ' + f1(q[1])).join('L') : '';
function ink(pts, p, { color = C.ink, w = 3.4, o = 1, tip = true, dash = '' } = {}) {
  const q = partial(pts, p); if (q.length < 2 || o <= 0) return '';
  let s = `<path d="${dOf(q)}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" opacity="${o}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
  if (tip && p < 1) { const e = q[q.length - 1]; s += penTip(e[0], e[1]); }
  return s;
}
const penTip = (x, y, color = C.ink) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="11" fill="${color}" opacity="0.08"/><circle cx="${f1(x)}" cy="${f1(y)}" r="4.2" fill="${color}"/>`;
// Several strokes drawn one after another over [a, b], each given time by its length.
function drawSeq(strokes, t, a, b, opts = {}) {
  const lens = strokes.map(s => s.length), tot = lens.reduce((x, y) => x + y, 0); let acc = 0, out = '';
  for (let i = 0; i < strokes.length; i++) {
    const s0 = a + (b - a) * acc / tot, s1 = a + (b - a) * (acc + lens[i]) / tot; acc += lens[i];
    out += ink(strokes[i], seg(t, s0, s1), opts);
  }
  return out;
}

/* ---- text ---------------------------------------------------------------- */
let DEFS = [], uid = 0;
const measureCtx = document.createElement('canvas').getContext('2d');
const MEASURED = new Map();
function handWidth(text, size) { const k = text + '|' + size; if (!MEASURED.has(k)) { measureCtx.font = `600 ${size}px Caveat`; MEASURED.set(k, measureCtx.measureText(text).width); } return MEASURED.get(k); }
function mono(x, y, text, { size = 22, color = C.ink, weight = 400, anchor = 'start', o = 1, ls = 0, italic = false } = {}) {
  if (o <= 0 || text === '') return '';
  return `<text x="${f1(x)}" y="${f1(y)}" font-family="${MONO}" font-size="${size}" font-weight="${weight}" fill="${color}" text-anchor="${anchor}" opacity="${o}"${ls ? ` letter-spacing="${ls}"` : ''}${italic ? ' font-style="italic"' : ''}>${esc(text)}</text>`;
}
// Writing by hand: the words revealed left to right with the pen at the edge.
function writing(x, y, text, size, p, { color = C.ink, o = 1, anchor = 'start', tip = true } = {}) {
  if (p <= 0 || o <= 0) return '';
  const w = handWidth(text, size), x0 = anchor === 'middle' ? x - w / 2 : x; const id = 'c' + (uid++);
  const rw = (w + size * 0.3) * easeOut(clamp(p));
  DEFS.push(`<clipPath id="${id}"><rect x="${f1(x0 - size * 0.2)}" y="${f1(y - size * 1.2)}" width="${f1(rw)}" height="${f1(size * 1.7)}"/></clipPath>`);
  let s = `<text x="${f1(x0)}" y="${f1(y)}" font-family="${HAND}" font-size="${size}" font-weight="600" fill="${color}" opacity="${o}" clip-path="url(#${id})">${esc(text)}</text>`;
  if (tip && p < 1) s += penTip(x0 - size * 0.2 + rw, y - size * 0.25 + Math.sin(p * 40) * size * 0.12);
  return s;
}
const typed = (text, p) => text.slice(0, Math.round(text.length * clamp(p)));
const monoW = (text, size) => text.length * size * 0.6;

/* ---- the surface's components ------------------------------------------ */
function chip(x, y, text, { o = 1, kind = 'match', size = 19, sub = '' } = {}) {
  if (o <= 0) return '';
  const col = kind === 'model' ? C.model : kind === 'held' ? C.held : kind === 'read' ? C.read : C.teal;
  const all = text + (sub ? '  ' + sub : ''); const w = monoW(all, size) + 26, h = size + 16;
  return `<g opacity="${o}"><rect data-box="1" x="${f1(x)}" y="${f1(y - h / 2)}" width="${f1(w)}" height="${h}" rx="${h / 2}" fill="${C.plate}" stroke="${col}" stroke-width="1.6"${kind === 'held' || kind === 'model' ? ' stroke-dasharray="5 4"' : ''}/>`
    + `<text x="${f1(x + 13)}" y="${f1(y + size * 0.36)}" font-family="${MONO}" font-size="${size}" fill="${col}">${esc(text)}${sub ? `<tspan fill="${C.ink3}">  ${esc(sub)}</tspan>` : ''}</text></g>`;
}
function selection(x, y, w, h, o) {
  if (o <= 0) return '';
  let s = `<g opacity="${o}"><rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" fill="none" stroke="${C.teal}" stroke-width="1.6" stroke-dasharray="7 6" rx="4"/>`;
  for (const [cx, cy] of [[x, y], [x + w, y], [x, y + h], [x + w, y + h]]) s += `<rect x="${f1(cx - 6)}" y="${f1(cy - 6)}" width="12" height="12" fill="${C.plate}" stroke="${C.teal}" stroke-width="1.6"/>`;
  s += `<line x1="${f1(x + w / 2)}" y1="${f1(y)}" x2="${f1(x + w / 2)}" y2="${f1(y - 26)}" stroke="${C.teal}" stroke-width="1.4"/><circle cx="${f1(x + w / 2)}" cy="${f1(y - 32)}" r="6.5" fill="${C.plate}" stroke="${C.teal}" stroke-width="1.6"/></g>`;
  return s;
}
function holdRing(x, y, t, a) { const k = seg(t, a, a + 0.7); if (k <= 0 || k >= 1) return ''; return `<circle cx="${x}" cy="${y}" r="${f1(14 + 46 * easeOut(k))}" fill="none" stroke="${C.teal}" stroke-width="2.4" opacity="${f1(1 - k)}"/>` + `<circle cx="${x}" cy="${y}" r="9" fill="${C.teal}" opacity="${f1(0.5 * (1 - k))}"/>`; }
function tap(x, y, t, a) { const k = seg(t, a, a + 0.45); if (k <= 0 || k >= 1) return ''; return `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(8 + 26 * easeOut(k))}" fill="${C.teal}" opacity="${f1(0.28 * (1 - k))}"/>`; }
function pill(x, y, label, { size = 18, state = 'offer', num = '', dot = false } = {}) {
  const text = label + (num ? ' ' + num : ''); const w = monoW(text, size) + 28 + (dot ? 14 : 0), h = size + 18;
  const on = state === 'on', reading = state === 'reading';
  const fill = on ? C.teal : C.plate, stroke = on ? C.teal : reading ? C.ink4 : C.rule, col = on ? C.plate : C.ink;
  let s = `<rect data-box="1" x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${h}" rx="${h / 2}" fill="${fill}" stroke="${stroke}" stroke-width="1.4"/>`;
  s += `<text x="${f1(x + 14)}" y="${f1(y + h / 2 + size * 0.36)}" font-family="${MONO}" font-size="${size}" fill="${col}">${esc(label)}${num ? `<tspan fill="${on ? C.plate : C.ink3}"> ${esc(num)}</tspan>` : ''}</text>`;
  if (dot) s += `<circle cx="${f1(x + w - 16)}" cy="${f1(y + h / 2)}" r="4" fill="${C.model}"/>`;
  return { s, w, h };
}
// The field: one input, what Enter will do, the four core buttons, what this is, what it affords.
function field(x, y, { o = 1, scale = 1, text = '', caret = true, line = '', reads = [], offers = [], width = 560 } = {}) {
  if (o <= 0) return '';
  const rowW = (items, isRead) => items.reduce((a, r) => a + pill(0, 0, r.label, { num: isRead ? r.num : '', size: 17, dot: r.dot }).w + 8, 0);
  width = Math.max(width, 120 + rowW(reads, true) + 12, 120 + rowW(offers, false) + 12, 36 + monoW(text, 21) + 20, 36 + monoW(line, 16));
  const k = 0.94 + 0.06 * easeOut(clamp(o)); let s = `<g opacity="${clamp(o)}" transform="translate(${f1(x)} ${f1(y)}) scale(${f1(scale * k * 100) / 100})">`;
  const h = 206; s += `<rect data-box="1" x="0" y="0" width="${width}" height="${h}" rx="10" fill="${C.plate}" stroke="${C.edge}" stroke-width="1.4"/><rect x="0" y="2" width="${width}" height="${h}" rx="10" fill="none" stroke="rgba(12,26,36,0.05)" stroke-width="3"/>`;
  s += `<rect data-box="1" x="16" y="16" width="${width - 32}" height="44" rx="6" fill="${C.paper}" stroke="${C.rule}" stroke-width="1.2"/>`;
  s += mono(30, 46, text || '', { size: 21, color: C.ink });
  if (caret) s += `<rect x="${f1(30 + monoW(text, 21) + 2)}" y="27" width="2" height="24" fill="${C.teal}"/>`;
  s += mono(18, 84, line, { size: 16, color: C.teal });
  // the four core buttons
  const core = ['name', 'copy', 'paste', 'erase'];
  core.forEach((c, i) => { const cx = 36 + (i % 2) * 44, cy = 122 + Math.floor(i / 2) * 46; s += `<circle cx="${cx}" cy="${cy}" r="18" fill="${C.paper}" stroke="${C.rule}" stroke-width="1.3"/>` + icon(c, cx, cy); });
  let px = 120; for (const r of reads) { const p = pill(px, 100, r.label, { state: r.on ? 'on' : 'reading', num: r.num, size: 17 }); s += p.s; px += p.w + 8; }
  px = 120; for (const r of offers) { const p = pill(px, 148, r.label, { state: r.on ? 'on' : 'offer', size: 17, dot: r.dot }); s += p.s; px += p.w + 8; }
  return s + '</g>';
}
function icon(kind, cx, cy) {
  const st = `stroke="${C.ink3}" stroke-width="1.6" fill="none" stroke-linecap="round"`;
  if (kind === 'name') return `<path d="M${cx - 7} ${cy + 6} L${cx - 7} ${cy - 6} L${cx + 7} ${cy + 6} L${cx + 7} ${cy - 6}" ${st}/>`;
  if (kind === 'copy') return `<rect x="${cx - 7}" y="${cy - 7}" width="10" height="10" ${st}/><rect x="${cx - 3}" y="${cy - 3}" width="10" height="10" ${st}/>`;
  if (kind === 'paste') return `<rect x="${cx - 6}" y="${cy - 6}" width="12" height="13" ${st}/><path d="M${cx - 3} ${cy - 8} h6" ${st}/>`;
  return `<path d="M${cx - 7} ${cy - 5} l4 -2 l3 5 l3 -5 l4 2" ${st}/><path d="M${cx - 6} ${cy + 3} h12" ${st}/>`;
}
function card(x, y, w, head, body, { o = 1, color = C.model, buttons = null, kept = 0 } = {}) {
  if (o <= 0) return '';
  const lines = body, h = 60 + lines.length * 36 + (buttons ? 52 : 0);
  const border = kept > 0 ? `rgb(${Math.round(lerp(123, 28, kept))},${Math.round(lerp(138, 95, kept))},${Math.round(lerp(148, 184, kept))})` : C.held;
  let s = `<g opacity="${o}"><rect data-box="1" x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${C.plate}" stroke="${border}" stroke-width="1.6"${kept < 1 ? ' stroke-dasharray="6 4"' : ''}/>`;
  s += `<circle cx="${x + 22}" cy="${y + 26}" r="5" fill="${color}"/>` + mono(x + 36, y + 32, head, { size: 18, color: C.ink3 });
  lines.forEach((l, i) => { s += mono(x + 20, y + 74 + i * 36, l, { size: 24, color: C.ink }); });
  if (buttons) { let bx = x + 20; for (const b of buttons) { const p = pill(bx, y + h - 52, b.label, { size: 19, state: b.on ? 'on' : 'offer' }); s += p.s; bx += p.w + 10; } }
  return s + '</g>';
}

/* ---- the camera: one infinite canvas, panned ------------------------------ */
const CAM = [
  [0, 0, 0, 1.06], [4.6, 20, -10, 1.0], [9.6, 20, -10, 1.0], [10.6, 1200, 0, 0.82], [11.6, 2420, -10, 1.0],
  [23.8, 2440, 10, 1.0], [24.9, 3700, 0, 0.8], [26.0, 5010, -40, 0.85], [39.8, 5010, -40, 0.85], [40.6, 4900, -40, 1.05],
  [49.8, 4900, -40, 1.05], [50.7, 6100, 0, 0.72], [51.6, 7330, -20, 0.8], [63.8, 7330, -20, 0.8], [65.0, 7200, 70, 0.76],
  [72.0, 7200, 70, 0.76], [73.2, 7360, 70, 0.76], [78.4, 7380, 70, 0.78], [82.0, 12000, 0, 0.98],
  [89.8, 12000, 0, 1.0], [97, 12000, 0, 1.02],
];
function camAt(t) {
  let i = 0; while (i < CAM.length - 2 && t > CAM[i + 1][0]) i++;
  const a = CAM[i], b = CAM[i + 1], k = ease(seg(t, a[0], b[0]));
  return { x: lerp(a[1], b[1], k), y: lerp(a[2], b[2], k), s: lerp(a[3], b[3], k) };
}
const camT = (c, cx = W / 2, cy = H / 2) => `translate(${f1(cx)} ${f1(cy)}) scale(${(Math.round(c.s * 1000) / 1000)}) translate(${f1(-c.x)} ${f1(-c.y)})`;

/* ======================================================================== */
/* The scenes. Each draws in world units; the camera chooses what is seen. */
/* ======================================================================== */

/* 01 — read: a circle read and redrawn; a pentagon held open. */
const S1 = {

/* 2026 — AI as a meta-word: meaning back inside the loop. */
function hist6(t) {
  const L = t - 47; if (L < -1 || L > 7.5) return '';

  const N = { lang: [x0 - 340, 110], comp: [x0 + 340, 110], mean: [x0, -210] };
  const edge = (a, b, bend) => { const A = N[a], B = N[b], dx = B[0] - A[0], dy = B[1] - A[1], l = Math.hypot(dx, dy), ux = dx / l, uy = dy / l; const p = [A[0] + ux * (R + 14), A[1] + uy * (R + 14)], q = [B[0] - ux * (R + 18), B[1] - uy * (R + 18)]; const m = [(p[0] + q[0]) / 2 - uy * bend, (p[1] + q[1]) / 2 + ux * bend]; const o = []; for (let i = 0; i <= 24; i++) { const u = i / 24; o.push([(1 - u) ** 2 * p[0] + 2 * (1 - u) * u * m[0] + u * u * q[0], (1 - u) ** 2 * p[1] + 2 * (1 - u) * u * m[1] + u * u * q[1]]); } return o; };

  s += circ('lang', 160, 0.2, 0.8, C.ink) + circ('comp', 161, 0.6, 1.2, C.ink);
  s += mono(N.lang[0], N.lang[1] + 8, 'language', { size: 22, anchor: 'middle', o: seg(L, 0.8, 1.1) });
  s += mono(N.comp[0], N.comp[1] + 8, 'computation', { size: 22, anchor: 'middle', o: seg(L, 1.2, 1.5) });
  const head = (pts, col, k) => k >= 1 ? headAt(pts, col, 1) : '';
  const e1 = edge('lang', 'comp', -40), e2 = edge('comp', 'lang', -40);
  s += ink(e1, seg(L, 1.3, 1.8), { tip: false, w: 3 }) + head(e1, C.ink, seg(L, 1.3, 1.8));
  s += ink(e2, seg(L, 1.8, 2.3), { tip: false, w: 3, color: C.ink3 }) + head(e2, C.ink3, seg(L, 1.8, 2.3));
  s += circ('mean', 162, 2.6, 3.3, C.teal);
  s += mono(N.mean[0], N.mean[1] + 8, 'meaning', { size: 22, anchor: 'middle', color: C.teal, weight: 500, o: seg(L, 3.3, 3.6) });

  return s;
}

/* ---- the desk and the pad: one board, twice -------------------------- */
function devices(t, gridRect) {

  const k = easeOut(seg(t, 78.6, 79.4)); const sc = 0.92 + 0.08 * k;

/* ---- one frame ---------------------------------------------------------- */
// t is the film's clock; v is v1's, which the demo's scenes, captions and status line run on.

window.__camAt = camAt2;

/* ---- the scrubber (absent when rendering) ---------------------------- */
if (params.has('render')) document.body.classList.add('render');
const scrub = document.getElementById('scrub'), tc = document.getElementById('tc'), playB = document.getElementById('play');
let playing = false, t0 = 0, tAt = Number(params.get('t') || 0);
function show(t) { tAt = t; render(t); scrub.value = t; tc.textContent = t.toFixed(2); }
scrub.addEventListener('input', () => { playing = false; playB.textContent = 'play'; show(Number(scrub.value)); });
playB.addEventListener('click', () => { playing = !playing; playB.textContent = playing ? 'pause' : 'play'; t0 = performance.now() - tAt * 1000; if (playing) requestAnimationFrame(loop); });
