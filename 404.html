<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - dyna.ink</title>
    <meta name="description" content="The page you're looking for has moved. Visit the dyna.ink whitepaper and demos.">

    <!-- Open Graph / Social Share -->
    <meta property="og:title" content="dyna.ink - Page Not Found">
    <meta property="og:description" content="The page you're looking for has moved. Visit the dyna.ink whitepaper and demos.">
    <meta property="og:image" content="https://jjh111.github.io/MetaMedium/Assets/thumb-dynaink.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="dyna.ink - Page Not Found">
    <meta name="twitter:description" content="The page you're looking for has moved. Visit the dyna.ink whitepaper and demos.">
    <meta name="twitter:image" content="https://jjh111.github.io/MetaMedium/Assets/thumb-dynaink.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        /* The whitepaper's hero, on the page a broken link lands on: the canvas
           ground, IBM Plex Mono, the wordmark with *dyna* in the teal and *.ink*
           in the ink, and AI BEYOND CHAT tracked to the wordmark's width (the
           same rule as index.html's .hero .tagline). Its values are the hero's;
           brand/tokens.css is where they come from. */
        :root {
            --ground: #131315;
            --ink: #e7e5e0;
            --muted: rgba(181, 179, 173, 0.95);
            --quiet: rgba(134, 132, 126, 0.95);
            --teal: #6fb3b8;
            --teal-soft: rgba(111, 179, 184, 0.85);
            --teal-line: rgba(111, 179, 184, 0.55);
            --teal-hover: #93cbcf;
            --face: 'IBM Plex Mono', 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
            --title: clamp(3rem, 10vw, 5.5rem);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { font-size: 17px; }
        body {
            font-family: var(--face);
            background: var(--ground);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            text-align: center;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* The hero's blueprint grid, faint. */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(111, 179, 184, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(111, 179, 184, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .container {
            max-width: 600px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            font-size: var(--title);
            font-weight: 500;
            letter-spacing: -0.035em;
            line-height: 1;
            margin-bottom: 0.75rem;
            color: var(--ink);
        }
        .title .meta { color: var(--teal); }

        /* A quarter of the wordmark, tracked to its width; the trailing
           tracking taken back so it centres on its letters. */
        .tagline {
            --track: 0.7554em;
            font-size: calc(var(--title) * 0.25);
            font-weight: 500;
            color: var(--teal-soft);
            letter-spacing: var(--track);
            margin-right: calc(-1 * var(--track));
            white-space: nowrap;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 600;
            color: rgba(231, 229, 224, 0.06);
            line-height: 1;
            margin-bottom: -1rem;
            letter-spacing: 0.1em;
        }

        h2 {
            font-size: 1.4rem;
            font-weight: 500;
            margin-bottom: 1rem;
            color: var(--ink);
        }

        p {
            font-size: 0.95rem;
            color: var(--muted);
            margin-bottom: 2rem;
            line-height: 1.7;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: center;
        }

        a {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 0.6rem 1.4rem;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            border-radius: 999px;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
        }

        .primary {
            background: rgba(111, 179, 184, 0.14);
            color: var(--teal-hover);
            border: 1px solid var(--teal-line);
        }
        .primary:hover { border-color: var(--teal-hover); background: rgba(111, 179, 184, 0.22); }

        .secondary {
            background: rgba(19, 19, 21, 0.6);
            color: var(--teal-soft);
            border: 1px solid var(--teal-line);
        }
        .secondary:hover { border-color: var(--teal-hover); color: var(--teal-hover); }

        .external-links {
            margin-top: 3rem;
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .external-links a {
            min-height: 0;
            padding: 0.5rem;
            color: var(--quiet);
            font-size: 0.85rem;
        }
        .external-links a:hover { color: var(--teal-hover); }

        a:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }

        /* Decorative sketch elements, in the teal of a reading. */
        .sketch-elements {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .sketch-elements svg {
            position: absolute;
            opacity: 0.12;
            stroke: var(--teal);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
        }
        .sketch-circle { width: 120px; height: 120px; top: 15%; left: 8%; }
        .sketch-rect { width: 80px; height: 80px; bottom: 20%; right: 10%; }
        .sketch-line { width: 100px; height: 60px; top: 25%; right: 12%; }
        .sketch-squiggle { width: 140px; height: 40px; bottom: 30%; left: 5%; }

        @media (max-width: 640px) {
            .sketch-elements svg { opacity: 0.07; }
            .error-code { font-size: 4rem; }
        }
    </style>
</head>
<body>
    <div class="sketch-elements">
        <svg class="sketch-circle" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="45" />
        </svg>
        <svg class="sketch-rect" viewBox="0 0 80 80">
            <rect x="10" y="10" width="60" height="60" rx="2" />
        </svg>
        <svg class="sketch-line" viewBox="0 0 100 60">
            <path d="M10 50 L90 10" />
        </svg>
        <svg class="sketch-squiggle" viewBox="0 0 140 40">
            <path d="M10 20 Q35 5 60 20 Q85 35 110 20 Q125 12 135 20" />
        </svg>
    </div>

    <div class="container">
        <div class="title"><span class="meta">dyna</span>.ink</div>
        <p class="tagline">AI beyond chat</p>

        <div class="error-code">404</div>
        <h2>Page Not Found</h2>
        <p>
            The page you're looking for has moved or no longer exists.
            This might have been an old link to the whitepaper.
        </p>

        <div class="links">
            <a href="https://jjh111.github.io/MetaMedium/" class="primary">
                Read the Whitepaper
            </a>
            <a href="https://jjh111.github.io/MetaMedium/app/" class="secondary">
                Try the Demo
            </a>
        </div>

        <div class="external-links">
            <a href="https://johnhanacek.com">johnhanacek.com</a>
            <a href="https://github.com/jjh111/MetaMedium">GitHub Repository</a>
        </div>
    </div>
</body>
</html>
