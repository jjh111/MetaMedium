:root {
  /* MetaMedium instrument palette (CLAUDE.md design system). Deliberately
     single-theme: this is ink on a stable ground, not a document. */
  --ground: #0a0a0f;
  --panel: rgba(18, 18, 26, 0.92);
  --rule: rgba(201, 168, 76, 0.18);
  --ink: #e8e4d9;        /* human ink */
  --agent: #8ab4c8;      /* the second citizen — cool against the warm gold */
  --gold: #c9a84c;       /* reserved for blessing: gestures, offers, artifacts */
  --dim: #a09880;
  --ui: 'Space Grotesk', system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--ground); color: var(--ink);
  font-family: var(--ui);
  touch-action: none;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

#canvas { position: absolute; inset: 0; cursor: crosshair; touch-action: none; }

/* ===== Chrome: recedes, never competes with the ink ===== */
.rail {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; padding: 14px 18px; z-index: 5; pointer-events: none;
}
.title { pointer-events: none; }
.title h1 {
  font-size: 15px; font-weight: 600; letter-spacing: 0.01em; color: var(--gold);
}
.title h1 span { font-weight: 300; color: var(--dim); }
.title p {
  font-size: 12px; font-weight: 300; color: var(--dim);
  margin-top: 3px; max-width: 46ch; line-height: 1.45;
}
.title kbd {
  font-family: var(--mono); font-size: 11px; color: var(--ink);
  border: 1px solid var(--rule); border-radius: 3px; padding: 0 4px;
}

.controls { display: flex; gap: 8px; pointer-events: auto; flex-shrink: 0; }
.controls button {
  background: transparent; border: 1px solid var(--rule); color: var(--dim);
  font: 12px var(--ui); padding: 7px 13px; border-radius: 5px; cursor: pointer;
  transition: border-color .15s, color .15s;
}
.controls button:hover { border-color: var(--gold); color: var(--gold); }
.controls button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.controls button[aria-pressed="true"] {
  border-color: var(--agent); color: var(--agent);
  background: rgba(138, 180, 200, 0.1);
}

/* ===== Inspector: reports on the last (or hovered) mark. No selection mode. ===== */
#inspector {
  position: absolute; top: 92px; right: 18px; width: 310px; z-index: 4;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 8px;
  padding: 12px 14px; font-family: var(--mono); font-size: 11.5px; line-height: 1.5;
  pointer-events: none; backdrop-filter: blur(8px);
  max-height: calc(100vh - 140px); overflow-y: auto;
}
#inspector .eyebrow {
  font-family: var(--ui); font-size: 10px; font-weight: 500;
  letter-spacing: 0.11em; text-transform: uppercase; color: var(--dim);
  margin-bottom: 8px;
}
#inspector .row { display: flex; gap: 8px; }
#inspector .k { color: var(--dim); min-width: 44px; flex-shrink: 0; }
#inspector .v { color: var(--ink); font-variant-numeric: tabular-nums; }
#inspector .reads { margin: 7px 0 4px; }
#inspector .read {
  display: flex; gap: 8px; align-items: baseline;
  font-variant-numeric: tabular-nums;
}
#inspector .read.top .type { color: var(--gold); }
#inspector .read .type { color: var(--ink); min-width: 76px; }
#inspector .read .w { color: var(--dim); min-width: 34px; }
#inspector .read .by { color: var(--dim); font-size: 10.5px; }
#inspector .why {
  color: var(--dim); font-size: 10.5px; padding: 0 4px 0 5px;
  border-left: 1px solid var(--rule); margin: 1px 4px 5px 6px;
  line-height: 1.45;
}
#inspector .sep { height: 1px; background: var(--rule); margin: 9px 0; }
#inspector .empty { color: var(--dim); font-family: var(--ui); font-size: 12px; }
#inspector .by-agent { color: var(--agent); }
#inspector .by-human { color: var(--ink); }

/* ===== Summon: floats at the gesture, dissolves if you keep drawing ===== */
#summon {
  position: absolute; z-index: 10; display: none; gap: 6px; align-items: center;
  background: var(--panel); border: 1px solid var(--rule);
  border-radius: 8px; padding: 8px; backdrop-filter: blur(8px);
}
#summon button {
  background: rgba(201, 168, 76, 0.12); border: 1px solid var(--rule); color: var(--ink);
  font: 12px var(--ui); padding: 7px 12px; border-radius: 5px; cursor: pointer;
  white-space: nowrap; transition: border-color .15s, color .15s;
}
#summon button:hover { border-color: var(--gold); color: var(--gold); }
#summon button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#summon button.match { color: var(--gold); font-weight: 500; }
#summon input {
  background: transparent; border: 1px solid var(--gold); color: var(--ink);
  font: 13px var(--ui); padding: 7px 10px; border-radius: 5px; width: 132px; outline: none;
}

.status {
  position: absolute; bottom: 12px; left: 18px; z-index: 5;
  font-family: var(--mono); font-size: 11px; color: var(--dim);
  pointer-events: none; font-variant-numeric: tabular-nums;
}
.legend {
  position: absolute; bottom: 12px; right: 18px; z-index: 5;
  display: flex; gap: 14px; font-size: 11px; color: var(--dim); pointer-events: none;
}
.legend i { display: inline-block; width: 16px; height: 2px; vertical-align: middle; margin-right: 5px; }

@media (max-width: 820px) {
  .title p { display: none; }
  #inspector {
    top: auto; bottom: 34px; right: 10px; left: 10px; width: auto;
    max-height: 34vh; font-size: 11px;
  }
  .legend { display: none; }
  .status { bottom: 10px; font-size: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="rail">
  <div class="title">
    <h1>No-Modes Session Engine <span>v0.3</span></h1>
    <p>Doodle anything. To hold a group as a thing: circle it, then draw a quick
       check <b>✓</b> beside the circle — that summons an offer. Name it, or keep
       drawing to ignore it. <kbd>Ctrl</kbd>+<kbd>Z</kbd> undoes.</p>
  </div>
  <div class="controls">
    <button id="agentBtn" aria-pressed="false" title="A second participant that echoes your strokes — scripted, not an LLM">Second participant</button>
    <button id="undoBtn" title="Ctrl+Z">Undo</button>
    <button id="resetBtn">Reset</button>
  </div>
</div>

<aside id="inspector" aria-live="polite"></aside>
<div id="summon"></div>
<div class="status" id="status"></div>
<div class="legend">
  <span><i style="background:#e8e4d9"></i>you</span>
  <span><i style="background:#8ab4c8"></i>participant 2</span>
  <span><i style="background:#c9a84c"></i>gesture / artifact</span>
</div>

<script src="metamedium-core.browser.js"></script>
<script>
(function () {
  const MM = window.MetaMediumCore;
  const session = MM.createSession();

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const summonEl = document.getElementById('summon');
  const statusEl = document.getElementById('status');
  const inspectorEl = document.getElementById('inspector');

  let state = session.getState();
  let live = null;      // stroke under the pointer
  let hoverId = null;   // inspected node (hover), else most recent

  // ===== Canvas sizing =====
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    render(session.getState());
  }
  addEventListener('resize', resize);

  // ===== A second participant: scripted, honest, useful =====
  // It echoes your last mark as its own mark — enough to prove that agent ink
  // is a full citizen (recognized, lassoable, blessable), without pretending
  // to be an LLM. A real tier joins the same way and calls session.propose().
  const agentBtn = document.getElementById('agentBtn');
  let agentId = null;
  let agentOn = false;
  agentBtn.onclick = () => {
    agentOn = !agentOn;
    agentBtn.setAttribute('aria-pressed', String(agentOn));
    if (agentOn && !agentId) agentId = session.join('agent', 'participant 2', Date.now());
    render(session.getState());
  };

  function echo(points) {
    const xs = points.map((p) => p.x);
    const dx = Math.max(...xs) - Math.min(...xs) + 56;
    const shifted = points.map((p) => ({ x: p.x + dx, y: p.y }));
    if (Math.max(...shifted.map((p) => p.x)) > innerWidth - 8) return; // stay on canvas
    session.addStroke(shifted, Date.now(), agentId);
  }

  // ===== Input: strokes in, nothing gated, no modes =====
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    live = [{ x: e.clientX, y: e.clientY }];
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!live) {
      const over = nodeAt(e.clientX, e.clientY);
      if (over !== hoverId) { hoverId = over; render(state); }
      return;
    }
    live.push({ x: e.clientX, y: e.clientY });
    render(state); // live ink
  });
  canvas.addEventListener('pointerup', () => {
    const points = live;
    live = null;
    if (!points || points.length < 3) { render(state); return; }

    // Clear hover *before* the engine notifies: the render it triggers must
    // report the mark just made, not whatever the cursor was resting on.
    hoverId = null;
    const before = session.getState().summon;
    const id = session.addStroke(points, Date.now());
    const after = session.getState();

    // Don't echo gestures — only content. (A lasso the agent copied would
    // leave a stray circle behind.)
    const wasGesture = after.summon && after.summon !== before;
    const isPendingLasso = after.pendingLassoId === id;
    if (agentOn && agentId && !wasGesture && !isPendingLasso) echo(points);
  });
  canvas.addEventListener('pointerleave', () => { hoverId = null; render(state); });

  document.getElementById('undoBtn').onclick = () => session.undo();
  document.getElementById('resetBtn').onclick = () => location.reload();
  addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); session.undo(); }
  });

  // ===== Queries over engine state =====
  const authorOf = (node) => {
    const e = node.edges.find((x) => x.rel === 'made-by');
    return e ? e.to : MM.LOCAL_PARTICIPANT;
  };
  const isAgentNode = (node) => authorOf(node) !== MM.LOCAL_PARTICIPANT;
  const nameOfParticipant = (pid) =>
    pid === MM.LOCAL_PARTICIPANT ? 'you' : (MM.wordOf(state.nodes.get(pid)) || pid);

  function nodeAt(x, y) {
    for (let i = state.contentIds.length - 1; i >= 0; i--) {
      const b = MM.boundsOf(state.nodes.get(state.contentIds[i]));
      if (b && x >= b.minX - 8 && x <= b.maxX + 8 && y >= b.minY - 8 && y <= b.maxY + 8) {
        return state.contentIds[i];
      }
    }
    return null;
  }

  // ===== Rendering: ink is ground truth, the reading is surfaced beside it =====
  function inkOf(node, style) {
    const points = MM.strokePointsOf(node);
    if (points) {
      ctx.beginPath();
      points.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
      ctx.strokeStyle = style.color;
      ctx.lineWidth = style.width;
      ctx.stroke();
      return;
    }
    for (const e of node.edges) { // artifact: draw its members (transparent within)
      if (e.rel !== 'has-part') continue;
      const m = state.nodes.get(e.to);
      if (m && !m.reps.some((r) => r.modality === 'erased')) inkOf(m, style);
    }
  }

  function render(s) {
    state = s;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Held recognition of known artifacts — hinted, never committed.
    for (const c of s.clusterCandidates) {
      const b = union(c.nodeIds.map((id) => MM.boundsOf(s.nodes.get(id))));
      ctx.setLineDash([4, 6]);
      ctx.strokeStyle = 'rgba(201,168,76,0.38)';
      ctx.lineWidth = 1;
      ctx.strokeRect(b.minX - 14, b.minY - 14, b.maxX - b.minX + 28, b.maxY - b.minY + 28);
      ctx.setLineDash([]);
      text(c.matches[0].name + '?  circle + ✓ to confirm', b.minX - 12, b.minY - 20, 'rgba(201,168,76,0.72)');
    }

    const inspectedId = hoverId || lastContentId(s);

    for (const id of s.contentIds) {
      const node = s.nodes.get(id);
      const isArtifact = s.artifacts.includes(id);
      const pending = s.pendingLassoId === id;
      const color = pending ? 'rgba(201,168,76,0.9)' : (isAgentNode(node) ? '#8ab4c8' : '#e8e4d9');

      inkOf(node, { color, width: id === inspectedId ? 2.6 : 2 });

      const b = MM.boundsOf(node);
      if (isArtifact && b) {
        brackets(b, '#c9a84c');
        text(MM.wordOf(node), b.minX, b.minY - 10, '#c9a84c');
      } else if (b && !pending) {
        const top = MM.topInterpretation(node);
        if (top) text(top, b.minX, b.maxY + 15, id === inspectedId ? 'rgba(160,152,128,0.95)' : 'rgba(160,152,128,0.5)');
      }
    }

    // The gesture that summoned: shown, so a misread is instantly visible.
    if (s.summon) {
      for (const gid of s.summon.gestureIds) {
        inkOf(s.nodes.get(gid), { color: 'rgba(201,168,76,0.55)', width: 3 });
      }
    }

    if (live) {
      ctx.beginPath();
      live.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
      ctx.strokeStyle = '#e8e4d9';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    renderSummon(s);
    renderInspector(s, inspectedId);

    const strokes = s.contentIds.length - s.artifacts.length;
    statusEl.textContent =
      strokes + ' loose · ' + s.artifacts.length + ' artifact' + (s.artifacts.length === 1 ? '' : 's') +
      ' · ' + s.participants.length + ' participants' +
      (s.pendingLassoId ? '  ·  circle held — ✓ to summon' : '');
  }

  function text(str, x, y, color) {
    ctx.font = "11px 'Space Grotesk', system-ui, sans-serif";
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function brackets(b, color) {
    const L = 12, p = 9;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    const corners = [
      [b.minX - p, b.minY - p, L, 0, 0, L], [b.maxX + p, b.minY - p, -L, 0, 0, L],
      [b.minX - p, b.maxY + p, L, 0, 0, -L], [b.maxX + p, b.maxY + p, -L, 0, 0, -L],
    ];
    for (const [x, y, dx1, dy1, dx2, dy2] of corners) {
      ctx.beginPath();
      ctx.moveTo(x + dx1, y + dy1); ctx.lineTo(x, y); ctx.lineTo(x + dx2, y + dy2);
      ctx.stroke();
    }
  }

  const union = (list) => list.reduce((a, b) => ({
    minX: Math.min(a.minX, b.minX), maxX: Math.max(a.maxX, b.maxX),
    minY: Math.min(a.minY, b.minY), maxY: Math.max(a.maxY, b.maxY),
  }));

  function lastContentId(s) {
    return s.contentIds.length ? s.contentIds[s.contentIds.length - 1] : null;
  }

  // ===== Inspector: what the machine currently holds, and why =====
  const esc = (t) => String(t).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  function renderInspector(s, id) {
    // While an offer stands, report on the offer — that's when it matters most.
    if (s.summon) return renderSummonScope(s);

    const node = id && s.nodes.get(id);
    if (!node) {
      inspectorEl.innerHTML = '<div class="eyebrow">what the engine holds</div>' +
        '<div class="empty">Draw something. Every mark keeps all its readings — ' +
        'nothing is committed until you bless it.</div>';
      return;
    }

    const isArtifact = s.artifacts.includes(id);
    // Strokes are attributed by made-by; artifacts by whoever named them.
    const author = MM.strokePointsOf(node)
      ? authorOf(node)
      : ((node.reps.find((r) => r.modality === 'word') || {}).source || MM.LOCAL_PARTICIPANT);
    const authorName = nameOfParticipant(author);
    let html = '<div class="eyebrow">' + (isArtifact ? 'artifact' : 'what the engine holds') + '</div>';

    html += '<div class="row"><span class="k">node</span><span class="v">' + esc(id) + '</span></div>';
    html += '<div class="row"><span class="k">by</span><span class="v ' +
      (author !== MM.LOCAL_PARTICIPANT ? 'by-agent' : 'by-human') + '">' + esc(authorName) + '</span></div>';

    if (isArtifact) {
      const members = node.edges.filter((e) => e.rel === 'has-part');
      html += '<div class="row"><span class="k">name</span><span class="v">' + esc(MM.wordOf(node)) + '</span></div>';
      html += '<div class="row"><span class="k">holds</span><span class="v">' + members.length + ' marks</span></div>';
      const sig = (node.reps.find((r) => r.modality === 'signature') || {}).data;
      if (sig) {
        html += '<div class="row"><span class="k">sig</span><span class="v">' +
          esc(Object.entries(sig).map(([k, v]) => v + '×' + k).join(' + ')) + '</span></div>';
      }
      const inst = node.edges.find((e) => e.rel === 'instance-of');
      if (inst) html += '<div class="row"><span class="k">same as</span><span class="v">' + esc(inst.to) + '</span></div>';
    }

    // Held interpretations — all of them, ranked, attributed, justified.
    const reads = MM.resemblances(node);
    if (reads.length) {
      html += '<div class="sep"></div><div class="eyebrow">reads as</div><div class="reads">';
      reads.forEach((e, i) => {
        html += '<div class="read' + (i === 0 ? ' top' : '') + '">' +
          '<span class="type">' + esc(e.to.replace(/^type:/, '')) + '</span>' +
          '<span class="w">' + (e.weight != null ? e.weight.toFixed(2) : '—') + '</span>' +
          '<span class="by">' + esc(e.via ? nameOfParticipant(e.via) : '') + '</span></div>';
        if (e.reasoning) html += '<div class="why">' + esc(e.reasoning) + '</div>';
      });
      html += '</div>';
    }

    // Relationships the engine inferred (never blessed by inference alone).
    const rels = node.edges.filter((e) =>
      ['touching', 'intersecting', 'contains', 'connects', 'connected-by', 'part-of'].includes(e.rel));
    if (rels.length) {
      html += '<div class="sep"></div><div class="eyebrow">relations</div>';
      const seen = new Set();
      rels.forEach((e) => {
        const key = e.rel + e.to;
        if (seen.has(key)) return;
        seen.add(key);
        const label = e.rel === 'part-of' ? 'part of ' + (MM.wordOf(s.nodes.get(e.to)) || e.to) : e.rel + ' ' + e.to;
        html += '<div class="row"><span class="k">' + (e.blessed ? 'blessed' : 'held') + '</span>' +
          '<span class="v">' + esc(label) + '</span></div>';
      });
    }

    const fp = MM.fingerprintOf(node);
    if (fp) {
      html += '<div class="sep"></div><div class="eyebrow">ground truth</div>' +
        '<div class="row"><span class="k">straight</span><span class="v">' + fp.straightness.toFixed(3) + '</span></div>' +
        '<div class="row"><span class="k">corners</span><span class="v">' + fp.corners + '</span></div>' +
        '<div class="row"><span class="k">closed</span><span class="v">' + (fp.isClosed ? 'yes' : 'no') + '</span></div>' +
        '<div class="row"><span class="k">size</span><span class="v">' + Math.round(fp.size) + 'px</span></div>';
    }

    inspectorEl.innerHTML = html;
  }

  // What the pending offer covers: the scope the lasso defined, and who made
  // each mark in it. Nothing here is committed — walking away is an answer.
  function renderSummonScope(s) {
    const ids = s.summon.enclosedIds;
    let html = '<div class="eyebrow">offer standing</div>' +
      '<div class="row"><span class="k">holds</span><span class="v">' + ids.length + ' marks</span></div>';

    const sig = {};
    ids.forEach((id) => {
      const t = MM.topInterpretation(s.nodes.get(id)) || 'mark';
      sig[t] = (sig[t] || 0) + 1;
    });
    html += '<div class="row"><span class="k">sig</span><span class="v">' +
      esc(Object.entries(sig).map(([k, v]) => v + '×' + k).join(' + ')) + '</span></div>';

    const authors = [...new Set(ids.map((id) => authorOf(s.nodes.get(id))))];
    html += '<div class="row"><span class="k">by</span><span class="v">' +
      authors.map((a) => '<span class="' + (a === MM.LOCAL_PARTICIPANT ? 'by-human' : 'by-agent') + '">' +
        esc(nameOfParticipant(a)) + '</span>').join(', ') + '</span></div>';

    html += '<div class="sep"></div><div class="eyebrow">offered</div>';
    s.summon.suggestions.forEach((sug) => {
      html += '<div class="row"><span class="k">' + (sug.kind === 'match' ? 'match' : '—') + '</span>' +
        '<span class="v">' + esc(sug.label) + '</span></div>';
    });
    html += '<div class="why" style="margin-top:7px">Ignoring this is a valid answer: ' +
      'keep drawing and the offer dissolves, leaving the marks as they were.</div>';

    inspectorEl.innerHTML = html;
  }

  // ===== Summon chips: non-modal — drawing anything else dissolves them =====
  let shownSummonId = null;
  function renderSummon(s) {
    if (!s.summon) { summonEl.style.display = 'none'; shownSummonId = null; return; }
    if (shownSummonId === s.summon.id) return;
    shownSummonId = s.summon.id;

    summonEl.innerHTML = '';
    summonEl.style.display = 'flex';
    for (const sug of s.summon.suggestions) {
      const btn = document.createElement('button');
      btn.textContent = sug.kind === 'match' ? '✓ ' + sug.label : sug.label;
      if (sug.kind === 'match') btn.className = 'match';
      btn.onclick = () => {
        if (sug.kind === 'name-as-new') return swapToInput(s.summon.id, btn);
        session.bless({ summonId: s.summon.id, suggestionId: sug.id, at: Date.now() });
      };
      summonEl.appendChild(btn);
    }

    const b = MM.boundsOf(s.nodes.get(s.summon.gestureIds[1]));
    summonEl.style.left = Math.max(8, Math.min(b.minX, innerWidth - 340)) + 'px';
    summonEl.style.top = Math.max(8, Math.min(b.maxY + 14, innerHeight - 70)) + 'px';
  }

  function swapToInput(summonId, btn) {
    const input = document.createElement('input');
    input.placeholder = 'name it…';
    input.onkeydown = (e) => {
      e.stopPropagation();
      if (e.key === 'Enter' && input.value.trim()) {
        session.bless({ summonId: summonId, name: input.value.trim(), at: Date.now() });
      }
    };
    btn.replaceWith(input);
    input.focus();
  }

  session.subscribe(render);
  document.fonts.ready.then(() => render(session.getState()));
  resize();
})();
</script>
</body>
</html>
