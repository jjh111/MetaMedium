<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MetaMedium — Ink Over Living Artifacts</title>
<link rel="stylesheet" href="surface/surface.css">
</head>
<body>
<div id="stage"></div>
<canvas id="canvas"></canvas>

<div class="rail">
  <div class="title">
    <h1>MetaMedium <span>MVP</span></h1>
    <button id="panelToggle" aria-expanded="true" title="Show or hide the panel">details ▾</button>
  </div>
  <div class="controls">
    <div class="markChip" id="markChip" title="The mark that turns a circled group into an offer. Click to teach your own.">
      <canvas id="markGlyph" width="34" height="22"></canvas><span id="markName">check</span>
    </div>
    <div class="zoomRow">
      <button id="zoomOut" title="Zoom out">−</button>
      <span class="z" id="zoomPct">100%</span>
      <button id="zoomIn" title="Zoom in">+</button>
      <button id="fitBtn" title="Fit everything on screen">Fit</button>
    </div>
    <button id="teachBtn" aria-pressed="false" title="Teach the canvas your command mark">Teach a mark…</button>
    <button id="modelBtn" aria-pressed="false" title="Add a model as a participant (Tier 1–2)">Add a model…</button>
    <button id="snapBtn" hidden title="Redraw every confidently read shape clean. The ink stays underneath; undo puts it back in front.">Snap</button>
    <button id="snapMode" title="offer: ghost the clean form and wait · auto: snap as you draw · off">snap · offer</button>
    <button id="undoBtn" title="Ctrl+Z">Undo</button>
    <button id="resetBtn">Reset</button>
  </div>
</div>

<div id="teachPanel" hidden>
  <div class="eyebrow">your command mark</div>
  <p class="hint" id="teachHint"></p>
  <canvas id="teachPad"></canvas>
  <div id="teachDots"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="tpRow">
    <button id="teachUse" disabled>Use this mark</button>
    <button id="teachClear">Clear</button>
    <button id="teachForget" hidden>Forget</button>
    <button id="teachClose">Close</button>
  </div>
  <div id="teachStatus"></div>
</div>

<div id="modelPanel" hidden>
  <div class="eyebrow">models</div>
  <p class="hint">A model joins as a peer and <b>proposes</b> — it never commits. Everything
     marked <span class="tier0">·now</span> in the palette works with none attached.</p>
  <div class="mpSection">
    <div class="mpHead"><span>on this machine</span><button id="mpDetect" class="ghost">Detect</button></div>
    <div id="mpLocal" class="mpLocal"><div class="hint">Ollama and LM Studio are looked for when this opens.</div></div>
  </div>
  <div class="mpSection">
    <div class="mpHead"><span>by key</span></div>
    <select id="mpProvider">
      <option value="openRouter">OpenRouter</option>
      <option value="anthropic">Anthropic</option>
      <option value="custom">Custom OpenAI-compatible endpoint</option>
    </select>
    <input id="mpEndpoint" placeholder="http://host:port/v1" autocomplete="off" spellcheck="false" hidden />
    <input id="mpModel" placeholder="model id" autocomplete="off" spellcheck="false" />
    <input id="mpKey" type="password" placeholder="API key" autocomplete="off" />
    <label class="mpRemember"><input type="checkbox" id="mpRememberKey" /> remember the key on this device</label>
    <div class="mpRow">
      <button id="mpAdd">Join</button>
      <button id="mpClose" class="ghost">Close</button>
    </div>
  </div>
  <div id="mpStatus" class="hint"></div>
  <div id="mpList"></div>
</div>

<div id="held" hidden>
  <span class="heldText" id="heldText"></span>
  <button id="heldSnap" title="Redraw the circled marks clean; the loop stays held">Draw clean</button>
  <button id="heldOffer" title="See what these could become — the same offer the mark gives">What could these be?</button>
</div>
<aside id="inspector" aria-live="polite"></aside>
<div id="summon"></div>
<div class="scrimBottom"></div>
<div class="status" id="status"></div>
<div id="replay" hidden>
  <button id="rpPrev" title="Previous step (←)">◀</button>
  <button id="rpPlay" title="Play / pause (space)">▶</button>
  <button id="rpNext" title="Next step (→)">▶|</button>
  <input id="rpScrub" type="range" min="0" max="0" value="0" />
  <span class="rpStep" id="rpStep"></span>
  <div class="rpCaption" id="rpCaption"></div>
</div>
<div class="legend">
  <span><i style="background:#e8e4d9"></i>you</span>
  <span><i style="background:#8ab4c8"></i>model</span>
  <span><i style="background:#c9a84c"></i>gesture / artifact</span>
</div>

<script src="metamedium-core.browser.js"></script>
<script src="session-engine.js"></script>
</body>
</html>
